        id: sub.label.toLowerCase().replace(/\s+/g, "_"),
        label: sub.label,
        items: getDailyItems(sub.items, 3),
      })),
    },
  ])
);

const TYPE_ICON = { article:"📄", video:"▶", podcast:"🎙" };
const TYPE_COLOR = { article:"#12BFBF", video:"#F58300", podcast:"#aa44aa" };

function InnerviewTab({ profile, C, sbClient }) {
  const isFemale = profile?.sex === "female";

  const CAT_META = {
    health:  { label:"Health",   color:"#12BFBF", icon:"❤️" },
    fitness: { label:"Fitness",  color:"#F58300", icon:"⚡" },
    cycle:   { label:"Cycle",    color:"#aa44aa", icon:"🌸" },
  };

  const SUBTOPIC_LABELS = {
    biomarkers:"Biomarkers 101", longevity:"Longevity", gut:"Gut Health",
    hormones:"Hormones", vo2max:"VO2 Max & Cardio", strength:"Strength & Muscle",
    sleep:"Sleep & Recovery", altitude:"High Altitude", phases:"Cycle Phases",
    hormones_cycle:"Hormones & Mood", nutrition_cycle:"Nutrition & Cycle",
    training_cycle:"Training with Your Cycle",
  };

  const categories = Object.entries(CAT_META).filter(([k]) => k !== "cycle" || isFemale);
  const [activeCategory, setActiveCat] = useState("health");
  const [activeSubtopic, setActiveSubtopic] = useState(null);
  const [liveContent, setLiveContent] = useState(null); // null = loading
  const [lastFetch, setLastFetch] = useState(null);

  // Fetch from Supabase on mount and when category changes
  useEffect(() => {
    if (!sbClient) return;
    let cancelled = false;
    const load = async () => {
      try {
        const { data, error } = await sbClient
          .from("innerview_content")
          .select("*")
          .order("published_at", { ascending: false })
          .limit(200);
        if (error || !data || data.length === 0) {
          setLiveContent({}); // fall through to static
          return;
        }
        if (cancelled) return;
        // Group by category → subtopic
        const grouped = {};
        for (const item of data) {
          const cat = item.category;
          const sub = item.subtopic;
          if (!grouped[cat]) grouped[cat] = {};
          if (!grouped[cat][sub]) grouped[cat][sub] = [];
          grouped[cat][sub].push(item);
        }
        setLiveContent(grouped);
        setLastFetch(new Date());
      } catch(e) {
        setLiveContent({});
      }
    };
    load();
    return () => { cancelled = true; };
  }, [sbClient]);

  const cat = CAT_META[activeCategory];

  // Merge live + static fallback
  const getItems = (catKey, subKey) => {
    if (liveContent && liveContent[catKey] && liveContent[catKey][subKey]) {
      return liveContent[catKey][subKey].slice(0, 4);
    }
    // Fallback to static pool
    const staticCat = INNERVIEW_POOL[catKey];
    if (!staticCat) return [];
    const staticSub = staticCat.subtopics[subKey];
    return staticSub ? getDailyItems(staticSub.items, 3) : [];
  };

  const subtopicKeys = Object.keys(INNERVIEW_POOL[activeCategory]?.subtopics || {});
  const filteredSubtopics = activeSubtopic ? [activeSubtopic] : subtopicKeys;

  const isLoading = liveContent === null;

  return (
    <div style={{ paddingBottom:100 }}>
      {/* Category tabs */}
      <div style={{ display:"flex", gap:6, marginBottom:16 }}>
        {categories.map(([key, val]) => (
          <button key={key} onClick={()=>{ setActiveCat(key); setActiveSubtopic(null); }}
            style={{ flex:1, padding:"8px 0", borderRadius:12, cursor:"pointer",
              border:`1px solid ${activeCategory===key ? val.color : C.border}`,
              background: activeCategory===key ? val.color+"18" : "transparent",
              color: activeCategory===key ? val.color : "#666", fontSize:12, fontWeight:500,
            }}>
            {val.icon} {val.label}
          </button>
        ))}
      </div>

      {/* Live indicator */}
      {lastFetch && (
        <div style={{ fontSize:10, color:"#444", marginBottom:12, textAlign:"right" }}>
          ↻ Updated {lastFetch.toLocaleDateString("en-US", { month:"short", day:"numeric" })}
        </div>
      )}
      {isLoading && (
        <div style={{ fontSize:11, color:"#444", marginBottom:12 }}>Loading latest content…</div>
      )}

      {/* Subtopic pills */}
      <div style={{ display:"flex", gap:6, flexWrap:"wrap", marginBottom:20 }}>
        <button onClick={()=>setActiveSubtopic(null)}
          style={{ padding:"5px 12px", borderRadius:20, fontSize:11, cursor:"pointer",
            border:`1px solid ${activeSubtopic===null ? cat.color : C.border}`,
            background: activeSubtopic===null ? cat.color+"22" : "transparent",
            color: activeSubtopic===null ? cat.color : "#666",
          }}>All</button>
        {subtopicKeys.map(sk => (
          <button key={sk} onClick={()=>setActiveSubtopic(activeSubtopic===sk ? null : sk)}
            style={{ padding:"5px 12px", borderRadius:20, fontSize:11, cursor:"pointer",
              border:`1px solid ${activeSubtopic===sk ? cat.color : C.border}`,
              background: activeSubtopic===sk ? cat.color+"22" : "transparent",
              color: activeSubtopic===sk ? cat.color : "#666",
            }}>{SUBTOPIC_LABELS[sk] || sk}</button>
        ))}
      </div>

      {/* Content cards */}
      {filteredSubtopics.map(sk => {
        const items = getItems(activeCategory, sk);
        if (items.length === 0) return null;
        return (
          <div key={sk} style={{ marginBottom:24 }}>
            <div style={{ fontSize:11, color:"#555", textTransform:"uppercase", letterSpacing:"0.07em", marginBottom:10 }}>
              {SUBTOPIC_LABELS[sk] || sk}
            </div>
            <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
              {items.map((item, i) => (
                <a key={i} href={item.url} target="_blank" rel="noopener noreferrer"
                  style={{ textDecoration:"none", display:"block",
                    background:C.card, borderRadius:14, border:`1px solid ${C.border}`,
                    padding:"14px 16px",
                  }}
                  onMouseEnter={e=>e.currentTarget.style.borderColor=cat.color+"60"}
                  onMouseLeave={e=>e.currentTarget.style.borderColor=C.border}>
                  <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", gap:10 }}>
                    {item.thumbnail_url && (
                      <img src={item.thumbnail_url} alt="" style={{ width:72, height:48, borderRadius:8, objectFit:"cover", flexShrink:0 }} />
                    )}
                    <div style={{ flex:1, minWidth:0 }}>
                      <div style={{ fontSize:13, color:"#ddd", lineHeight:1.4, marginBottom:6 }}>{item.title}</div>
                      <div style={{ display:"flex", gap:8, alignItems:"center", flexWrap:"wrap" }}>
                        <span style={{ fontSize:10, color:TYPE_COLOR[item.type]||"#888", background:(TYPE_COLOR[item.type]||"#888")+"18", padding:"2px 7px", borderRadius:10 }}>
                          {TYPE_ICON[item.type]||"◎"} {item.type}
                        </span>
                        <span style={{ fontSize:10, color:"#555" }}>{item.source}</span>
                        {item.duration && <span style={{ fontSize:10, color:"#444" }}>{item.duration}</span>}
                        {item.published_at && <span style={{ fontSize:10, color:"#333" }}>{item.published_at}</span>}
                      </div>
                    </div>
                    <svg width="14" height="14" viewBox="0 0 14 14" fill="none" style={{ flexShrink:0, marginTop:2 }}>
                      <path d="M2 12 L12 2 M7 2 H12 V7" stroke="#333" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
                    </svg>
                  </div>
                </a>
              ))}
            </div>
          </div>
        );
      })}
    </div>
  );
}

    "overwrite","replace","reemplaza","reemplazar","sobrescribe","sobrescribir",

    "start fresh","clear old","replace all","replace existing"

  const detectMetricsInMessage = (msg) => {
    const lower = msg.toLowerCase();
    const detected = [];
    const isOverwrite = OVERWRITE_KEYWORDS.some(kw => lower.includes(kw));

    for (const mapping of CLIENT_METRIC_MAP) {
      const keyFound = mapping.keys.some(k => lower.includes(k));
      if (!keyFound) continue;

      // ── PATTERN: "same value for N days" — flexible, order-independent ──────────
      // Detects ANY message that has:
      //   1. A period reference: "últimos 180 días", "last 90 days", "6 meses", "3 months", etc.
      //   2. A metric value somewhere in the message
      // Works regardless of word order or phrasing.
      const periodMatch = lower.match(
        /(?:últimos?|ultimos?|last|past|during|durante|por los?|todos los?|every day for|cada día por)\s+(\d+)\s*(días?|dias?|d\b|semanas?|weeks?|w\b|meses?|months?|m\b)|(\d+)\s*(días?|dias?|semanas?|weeks?|meses?|months?)\s+(?:seguidos?|consecutivos?|de|of|straight)/i
      );
      const METRIC_RANGES = {
        vo2_max:[20,90], hrv:[1,300], resting_hr:[30,220],
        sleep_hours:[1,24], steps:[100,100000], calories_burned:[100,10000],
        spo2:[70,100], stress_score:[0,100], body_fat:[3,60],
        glucose:[40,600], hba1c:[3,15], total_chol:[50,500],
        ldl:[10,400], hdl:[10,150], triglycerides:[20,2000],
        weight_kg:[20,300],
      };

      if (periodMatch) {
        const rawCount = periodMatch[1] || periodMatch[3];
        const rawUnit  = (periodMatch[2] || periodMatch[4] || "d").toLowerCase();
        const count = parseInt(rawCount);
        const daysPerUnit = rawUnit.startsWith("mes") || rawUnit.startsWith("month") ? 30
          : rawUnit.startsWith("sem") || rawUnit.startsWith("week") ? 7 : 1;
        const totalDays = count * daysPerUnit;

        // Extract the metric value: all numbers in msg filtered by this metric's range
        // Strip the period number itself to avoid confusion
        const msgStripped = msg.replace(new RegExp(`\\b${count}\\b`), "");
        const range = METRIC_RANGES[mapping.field];
        const allNums = [...msgStripped.matchAll(/\b(\d+(?:[.,]\d+)?)\b/g)]
          .map(m => parseFloat(m[1].replace(",",".")))
          .filter(n => !isNaN(n) && n > 0);
        const metricVal = range
          ? allNums.find(n => n >= range[0] && n <= range[1])
          : allNums[0];

        if (metricVal !== undefined && totalDays >= 1) {
          const today = new Date();
          const numEntries = Math.min(totalDays, 365);
          for (let i = 0; i < numEntries; i++) {
            const d = new Date(today);
            d.setDate(d.getDate() - (numEntries - 1 - i));
            detected.push({
              field: mapping.field, category: mapping.cat,
              value: metricVal, unit: mapping.unit,
              date: d.toISOString().split("T")[0],
              overwrite: isOverwrite || i === 0, // always overwrite for bulk inserts
            });
          }
          break;
        }
      }

      // ── STANDARD DETECTION (existing logic) ──────────────────────────────────
      // Remove context numbers: digits followed by time/quantity words
      const cleaned = msg
        .replace(/\b\d+\s*(?:mes(?:es)?|meses|semanas?|weeks?|months?|days?|días?|años?|years?|hours?|horas?)\b/gi, "")
        .replace(/(?:last|últimos?|últimas?|past|hace)\s+\d+/gi, "")
        .replace(/(?:los|las|the)\s+últimos?\s+\d+/gi, "");

      const colonIdx = cleaned.indexOf(":");
      const searchStr = colonIdx >= 0 ? cleaned.slice(colonIdx) : cleaned;

      const numbers = [...searchStr.matchAll(/\b(\d+(?:[.,]\d+)?)\b/g)]
        .map(m => parseFloat(m[1].replace(",",".")))
        .filter(n => !isNaN(n) && n > 0 && n < 10000);

      const RANGES = {
        vo2_max:[20,90], hrv:[1,300], resting_hr:[30,220],
        sleep_hours:[1,24], steps:[100,100000], calories_burned:[100,10000],
        spo2:[70,100], stress_score:[0,100], body_fat:[3,60],
        glucose:[40,600], hba1c:[3,15], total_chol:[50,500],
        ldl:[10,400], hdl:[10,150], triglycerides:[20,2000],
        weight_kg:[20,300],
      };
      const range = RANGES[mapping.field];
      const filtered = range
        ? numbers.filter(n => n >= range[0] && n <= range[1])
        : numbers;

      if (filtered.length === 0) continue;

      console.log("[Innermark] Detected", mapping.field, "values:", filtered);

      const today = new Date();
      if (filtered.length === 1) {
        detected.push({
          field: mapping.field, category: mapping.cat,
          value: filtered[0], unit: mapping.unit,
          date: today.toISOString().split("T")[0],
          overwrite: isOverwrite,
        });
      } else {
        filtered.forEach((val, i) => {
          const d = new Date(today);
          d.setDate(d.getDate() - (filtered.length - 1 - i) * 30);
          detected.push({
            field: mapping.field, category: mapping.cat,
            value: val, unit: mapping.unit,
            date: d.toISOString().split("T")[0],
            overwrite: isOverwrite && i === 0,
          });
        });
      }
      break;
    }
    return detected;
  };

      setImportState(s=>({...s, status:"done", detected, progress:""}));

  const toggleRecording = async () => {
    if (isRecording) {
      // Stop recording
      if (silenceTimerRef.current) { clearTimeout(silenceTimerRef.current); silenceTimerRef.current = null; }
      if (mediaRecorderRef.current) {
        mediaRecorderRef.current.stop();
        setIsRecording(false);
      }
    } else {
      // Start recording
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioChunksRef.current = [];
        const mimeType = MediaRecorder.isTypeSupported("audio/webm;codecs=opus") ? "audio/webm;codecs=opus"
          : MediaRecorder.isTypeSupported("audio/webm") ? "audio/webm"
          : MediaRecorder.isTypeSupported("audio/mp4") ? "audio/mp4"
          : "audio/ogg";
        const mr = new MediaRecorder(stream, { mimeType });
        mr.ondataavailable = e => { if (e.data.size > 0) audioChunksRef.current.push(e.data); };
        mr.onstop = async () => {
          stream.getTracks().forEach(t => t.stop());
          if (audioChunksRef.current.length === 0) return;
          const blob = new Blob(audioChunksRef.current, { type: mimeType });
          await transcribeAndSend(blob);
        };
        mr.start(100); // collect data every 100ms for reliability
        mediaRecorderRef.current = mr;
        setIsRecording(true);

        // Auto-stop after 60s with confirmation
        silenceTimerRef.current = setTimeout(() => {
          if (mediaRecorderRef.current?.state === "recording") {
            mediaRecorderRef.current.stop();
            setIsRecording(false);
            setAwaitingSendConfirm(true);
          }
        }, 60000);

      } catch(e) {
        console.error("Mic error:", e);
        alert("Microphone access denied. Please allow microphone access in your browser settings.");
      }
    }
  };

  const transcribeAndSend = async (audioBlob) => {
    setChatLoading(true);
    try {
      const { data: { session } } = await sbClient.auth.getSession();
      const ext = audioBlob.type.includes("mp4") ? "audio.mp4" : audioBlob.type.includes("ogg") ? "audio.ogg" : "audio.webm";
      const formData = new FormData();
      formData.append("audio", audioBlob, ext);
      const res = await fetch("https://ljwzvnmyviunmykbwquz.supabase.co/functions/v1/whisper-transcribe", {
        method: "POST",
        headers: { "Authorization": `Bearer ${session?.access_token}` },
        body: formData,
      });
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      if (data.text?.trim()) {
        // Send directly without showing in input
        await sendChat(data.text.trim());

    } catch(e) {
      console.error("Transcription error:", e);

  const computeFitnessScore = (metrics, profile) => {
    if (!metrics || metrics.length === 0) return null;
    const recent = metrics.slice(-7); // last 7 days
    const avg = (arr) => arr.filter(Boolean).length ? arr.filter(Boolean).reduce((a,b)=>a+b,0)/arr.filter(Boolean).length : null;

    const avgCalories    = avg(recent.map(m=>m.calories_burned));
    const avgActiveMin   = avg(recent.map(m=>m.active_minutes));
    const avgRestingHR   = avg(recent.map(m=>m.resting_hr));
    const avgSleepHours  = avg(recent.map(m=>m.sleep_hours));
    const avgHRV         = avg(recent.map(m=>m.hrv));
    const avgSteps       = avg(recent.map(m=>m.steps));
    const avgSpO2        = avg(recent.map(m=>m.spo2));

    const isAthlete = (profile?.exerciseHours||0) >= 8;
    const age = profile?.age || 35;

    let scores = [];

    // VO2 max — 30% (from Strava estimated if available)
    // We use active minutes as proxy when VO2 not available
    if (avgActiveMin !== null) {
      const target = isAthlete ? 90 : 45;
      const vo2Score = Math.min(100, (avgActiveMin / target) * 100);
      scores.push({ score: vo2Score, weight: 0.30 });
    }

    // HRV — 20%
    if (avgHRV !== null) {
      const optHRV = isAthlete ? 65 : (age > 50 ? 35 : 50);
      const hrvScore = Math.min(100, (avgHRV / optHRV) * 100);
      scores.push({ score: hrvScore, weight: 0.20 });
    }

    // Sleep — 18%
    if (avgSleepHours !== null) {
      let sleepScore = 100;
      if (avgSleepHours < 6) sleepScore = 40;
      else if (avgSleepHours < 7) sleepScore = 70;
      else if (avgSleepHours <= 9) sleepScore = 100;
      else sleepScore = 75;
      scores.push({ score: sleepScore, weight: 0.18 });
    }

    // Resting HR — 12%
    if (avgRestingHR !== null) {
      let hrScore = 100;
      if (avgRestingHR > 100) hrScore = 20;
      else if (avgRestingHR > 80) hrScore = 50;
      else if (avgRestingHR > 70) hrScore = 70;
      else if (avgRestingHR > 60) hrScore = 85;
      else hrScore = 100;
      scores.push({ score: hrScore, weight: 0.12 });
    }

    // Steps — 10%
    if (avgSteps !== null) {
      const targetSteps = isAthlete ? 12000 : 8000;
      const stepsScore = Math.min(100, (avgSteps / targetSteps) * 100);
      scores.push({ score: stepsScore, weight: 0.10 });
    }

    // SpO2 — 5% (altitude-adjusted)
    if (avgSpO2 !== null) {
      const altM = profile?.altitudeM || 0;
      const minOk = altM > 3000 ? 92 : altM > 2000 ? 93 : 95;
      const spo2Score = avgSpO2 >= minOk ? 100 : Math.max(0, (avgSpO2 - 88) / (minOk - 88) * 100);
      scores.push({ score: spo2Score, weight: 0.05 });
    }

    // Calories — 5%
    if (avgCalories !== null) {
      const targetCal = isAthlete ? 600 : 300;
      const calScore = Math.min(100, (avgCalories / targetCal) * 100);
      scores.push({ score: calScore, weight: 0.05 });
    }

    if (!scores.length) return null;
    const totalWeight = scores.reduce((s,x)=>s+x.weight, 0);
    const weighted = scores.reduce((s,x)=>s+(x.score*x.weight), 0) / totalWeight;
    return Math.round(weighted);
  };

                vo2max:    { what:"VO2 Max measures the maximum rate at which your body can consume oxygen during exercise. It's one of the strongest predictors of longevity — people in the top 25% have a 5x lower risk of all-cause mortality than those in the bottom 25%.", why:"Higher VO2 max means your heart, lungs, and muscles work together more efficiently. It reflects both cardiovascular fitness and mitochondrial density in your muscles.", improve:["Zone 2 cardio (conversational pace) 3-4x per week for 45-60 min builds aerobic base","HIIT intervals (4×4 min at 90-95% max HR) once a week add the top-end stimulus","Consistency over months is what drives VO2 max — it responds slowly but the gains are durable","At altitude (2,600m) your body already produces more red blood cells, giving you a natural edge"] },
                hrv:       { what:"Heart Rate Variability measures the variation in time between consecutive heartbeats. Higher HRV indicates your autonomic nervous system is well-regulated and your body is recovering efficiently.", why:"HRV reflects the balance between your sympathetic (fight-or-flight) and parasympathetic (rest-and-digest) nervous systems. Low HRV often precedes illness, overtraining, or burnout — days before you feel it.", improve:["Sleep is the #1 driver of HRV — consistent 7-9 hours dramatically improves baseline","Slow breathing (4s in, 6s out) for 5 minutes activates the vagus nerve and raises HRV acutely","Alcohol, even 1-2 drinks, suppresses HRV significantly the following night","Altitude living tends to increase HRV over time as the body adapts to lower O2"] },

                sleep:     { what:"Sleep duration is one of the most impactful variables for health, performance, and longevity. During sleep your brain clears metabolic waste, your muscles repair, and your immune system consolidates.", why:"Below 7 hours chronically, cognitive function drops, cortisol rises, immune function weakens, and cardiovascular risk increases. The effect is dose-dependent — each hour below 7 has measurable consequences.", improve:["Consistent sleep and wake times regulate your circadian rhythm and improve sleep quality","Temperature below 18°C (65°F) in your bedroom accelerates sleep onset","Avoid screens 1 hour before bed — blue light suppresses melatonin by up to 3 hours","Alcohol fragments sleep architecture even if it helps you fall asleep faster"] },
                steps:     { what:"Daily step count is a simple proxy for overall physical activity and non-exercise movement (NEAT). Even without formal exercise, walking has strong independent associations with cardiovascular health and longevity.", why:"Research shows mortality risk continues to decline up to ~7,500-10,000 steps/day. The benefit is largely from reducing sedentary time — long periods of sitting are harmful even if you exercise regularly.", improve:["Walking meetings, standing desk, and stairs are the most sustainable step-adders","A 10-minute walk after meals improves glucose control significantly","Aim for movement every 60-90 minutes when sedentary — short breaks compound over the day"] },
                calories:  { what:"Calories burned reflects your total daily energy expenditure from exercise and activity. This includes both the calories burned during workouts and the EPOC (excess post-exercise oxygen consumption) effect afterward.", why:"Understanding your output helps calibrate your nutrition. Athletes in heavy training phases can burn 600-1,000+ kcal in a single session. Chronically underfueling relative to output impairs recovery, hormones, and performance.", improve:["Track weekly trends, not daily numbers — output varies significantly by training phase","High-intensity sessions burn fewer calories than long Zone 2 sessions but create more EPOC","At altitude, you burn slightly more calories at rest due to the increased respiratory effort"] },
                activeMin: { what:"Active minutes measures time spent in moderate-to-vigorous physical activity — typically heart rate above 50-70% of max. It's the most direct measure of exercise dose in your day.", why:"WHO guidelines recommend 150-300 min/week of moderate activity or 75-150 min of vigorous activity. Active minutes operationalize this in real time.", improve:["45+ minutes per day of active time is associated with the largest longevity benefits","Mix intensities: Zone 2 for base, Zone 4-5 for VO2 stimulus","Rest days count — 10-15 active minutes of light walking still benefits recovery"] },
                spo2:      { what:"SpO2 (oxygen saturation) measures the percentage of hemoglobin in your blood that is carrying oxygen. It reflects how effectively your lungs are oxygenating your blood.", why:"At sea level, normal SpO2 is 95-100%. At altitude (2,600m in Bogotá), values of 92-95% are normal and expected — your body has adapted by increasing red blood cell production. Chronic values below 90% indicate a problem.", improve:["At 2,600m, your baseline SpO2 will naturally be lower than sea level — this is adaptation, not disease","Breathing exercises (diaphragmatic breathing, box breathing) can temporarily raise SpO2","Poor sleep position, nasal congestion, or anemia can lower overnight SpO2","Altitude-adapted athletes develop higher hematocrit which improves O2 delivery despite lower SpO2"] },

                    <div style={{ fontSize:13, color:"#ccc", lineHeight:1.7 }}>{info.what}</div>
                  </div>

                  <div style={{ background:C.card, borderRadius:16, border:`1px solid ${C.border}`, padding:"16px", marginBottom:12 }}>
                    <div style={{ fontSize:11, color:"#555", textTransform:"uppercase", letterSpacing:"0.07em", marginBottom:8 }}>Why it matters</div>
                    <div style={{ fontSize:13, color:"#ccc", lineHeight:1.7 }}>{info.why}</div>
                  </div>

                  {info.improve.length > 0 && (
                    <div style={{ background:C.card, borderRadius:16, border:`1px solid ${C.border}`, padding:"16px", marginBottom:12 }}>
                      <div style={{ fontSize:11, color:"#555", textTransform:"uppercase", letterSpacing:"0.07em", marginBottom:12 }}>How to improve</div>
                      {info.improve.map((tip, i) => (
                        <div key={i} style={{ display:"flex", gap:10, marginBottom:10, alignItems:"flex-start" }}>
                          <div style={{ width:6, height:6, borderRadius:"50%", background:selectedFitnessMetric.color, flexShrink:0, marginTop:5 }} />
                          <div style={{ fontSize:13, color:"#ccc", lineHeight:1.6 }}>{tip}</div>
                        </div>
                      ))}
                    </div>
                  )}

                  <button onClick={()=>{ setSelectedFitnessMetric(null); setChatOpen(true); }}
                    style={{ width:"100%", padding:"13px 0", borderRadius:14, background:C.teal, border:"none", color:"#000", cursor:"pointer", fontSize:14, fontWeight:600, marginTop:8 }}>
                    Ask Innerpilot about my {m.label} ◎
                  </button>
                </>
              );
            })()}
          </div>
        </div>
      )}

      {selectedMarker && (
        <MarkerDetailScreen
          analysis={selectedMarker}
          profile={fullProfile}
          onClose={()=>setSelectedMarker(null)}
        />
      )}
      {importState.open && (
        <ImportModal
          state={importState}
          onToggle={handleToggle}
          onApply={applyImport}
          onAnalyzeText={detected => setImportState(s=>({...s, status:"done", detected}))}
          onClose={()=>setImportState(s=>({...s,open:false}))}
        />
      )}

      {/* Header */}
      <div style={{ padding:"52px 20px 12px" }}>
        {mainTab === "dashboard" ? (
          <div>
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:12 }}>
              <div style={{ display:"flex", alignItems:"center", gap:8 }}>
                <span style={{ fontSize:18 }}>◎</span>
                <span style={{ fontSize:18, fontWeight:500, letterSpacing:"-0.3px", color:C.teal }}>Innermark</span>
              </div>
              <div />
            </div>
            {(() => {
              const q = getDailyQuote(fullProfile);
              return (
                <div style={{ marginBottom:4 }}>
                  <div style={{ fontSize:14, color:"#ccc", fontStyle:"italic", lineHeight:1.5 }}>"{q.text}"</div>
                  <div style={{ fontSize:11, color:"#444", marginTop:4 }}>— {q.author}</div>
                </div>
              );
            })()}
          </div>
        ) : (
          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-end" }}>
            <div>
              <div style={{ fontSize:12, color:"#444" }}>
                {mainTab === "fitness" ? "Fitness" : mainTab === "trends" ? "Trends" : mainTab === "cycle" ? "Cycle" : "Innerview"}
              </div>
              <div style={{ fontSize:22, fontWeight:500, letterSpacing:"-0.3px", marginTop:2, color:"#fff" }}>
                {mainTab === "fitness" ? "Your fitness" : mainTab === "trends" ? "Progress" : mainTab === "cycle" ? "Your cycle" : "Learn & explore"}
              </div>
            </div>
            <div />
          </div>
        )}
      </div>

      {/* Content */}
      <div style={{ padding:"0 20px" }}>
        {mainTab==="dashboard" && DashboardTab()}
        {mainTab==="fitness"   && FitnessTab()}
        {mainTab==="trends"    && <TrendsTab sessions={sessions} fitnessMetrics={fitnessMetrics} weightHistory={weightHistory} markers={markers} profile={profile} customMetrics={customMetrics} />}
        {mainTab==="cycle"     && <CycleTab cycleLog={cycleLog} setCycleLog={setCycleLog} user={user} sbClient={sbClient} C={C} />}
        {mainTab==="innerview" && <InnerviewTab profile={profile} C={C} sbClient={sbClient} />}
        {mainTab==="profile"   && ProfileTab()}
      </div>

      {/* PWA Install Banner */}
      {showInstallBanner && !showIOSInstructions && (
        <div style={{
          position:"fixed", bottom:90, left:"50%", transform:"translateX(-50%)",
          width:"calc(100% - 32px)", maxWidth:420,
          background:"#111", border:`1px solid ${C.teal}40`,
          borderRadius:16, padding:"14px 16px", zIndex:45,
          display:"flex", alignItems:"center", gap:12,
          boxShadow:"0 4px 24px rgba(0,0,0,0.6)",
        }}>
          <span style={{ fontSize:24, flexShrink:0 }}>◎</span>
          <div style={{ flex:1, minWidth:0 }}>
            <div style={{ fontSize:13, fontWeight:500, color:"#fff", marginBottom:2 }}>Install Innermark</div>
            <div style={{ fontSize:11, color:"#555" }}>Add to your home screen for the best experience</div>
          </div>
          <button onClick={handleInstall}
            style={{ padding:"7px 14px", borderRadius:10, background:C.teal, border:"none", color:"#000", cursor:"pointer", fontSize:12, fontWeight:600, flexShrink:0 }}>
            {isIOS ? "How?" : "Install"}
          </button>
          <button onClick={()=>{ setShowInstallBanner(false); localStorage.setItem('innermark-install-dismissed','1'); }}
            style={{ background:"none", border:"none", color:"#444", cursor:"pointer", fontSize:18, padding:0, flexShrink:0 }}>✕</button>
        </div>
      )}

      {/* iOS Install Instructions Modal */}
      {showIOSInstructions && (
        <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.85)", zIndex:200, display:"flex", alignItems:"flex-end", justifyContent:"center" }}>
          <div style={{ background:"#111", borderRadius:"20px 20px 0 0", border:`1px solid ${C.border}`, padding:"24px 20px 40px", width:"100%", maxWidth:480 }}>
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:20 }}>
              <div style={{ fontSize:16, fontWeight:500 }}>Install Innermark</div>
              <button onClick={()=>setShowIOSInstructions(false)} style={{ background:"none", border:"none", color:"#666", cursor:"pointer", fontSize:22 }}>✕</button>
            </div>
            {[
              { step:"1", icon:"⬆️", text:'Tap the Share button at the bottom of Safari' },
              { step:"2", icon:"📲", text:'Scroll down and tap "Add to Home Screen"' },
              { step:"3", icon:"✅", text:'Tap "Add" — Innermark appears on your home screen' },
            ].map(s => (
              <div key={s.step} style={{ display:"flex", gap:14, alignItems:"flex-start", marginBottom:16 }}>
                <div style={{ width:28, height:28, borderRadius:"50%", background:C.teal+"20", border:`1px solid ${C.teal}40`, display:"flex", alignItems:"center", justifyContent:"center", color:C.teal, fontSize:12, fontWeight:600, flexShrink:0 }}>{s.step}</div>
                <div style={{ flex:1 }}>
                  <span style={{ fontSize:20, marginRight:8 }}>{s.icon}</span>
                  <span style={{ fontSize:13, color:"#ccc", lineHeight:1.5 }}>{s.text}</span>
                </div>
              </div>
            ))}
            <div style={{ marginTop:8, padding:"10px 14px", background:C.teal+"10", borderRadius:10, fontSize:11, color:"#666", textAlign:"center" }}>
              Only available in Safari on iOS
            </div>
          </div>
        </div>
      )}

      {/* Profile bubble — fixed top right */}
      <button
        onClick={() => setMainTab(prev => prev === "profile" ? (prevTabRef.current || "dashboard") : (prevTabRef.current = prev, "profile"))}
        style={{
          position:"fixed",
          top:16,
          right:"max(16px, calc((100vw - 480px)/2 + 16px))",
          width:36, height:36, borderRadius:"50%",
          background:mainTab==="profile" ? C.teal+"30" : "#111",
          border:`1.5px solid ${mainTab==="profile" ? C.teal : C.teal+"50"}`,
          color:C.teal, cursor:"pointer", fontSize:14, fontWeight:600, zIndex:50,
          display:"flex", alignItems:"center", justifyContent:"center",
          boxShadow:"0 2px 12px rgba(0,0,0,0.5)",
        }}>
        {initials}
      </button>

      {/* Floating chat button */}
      {!chatOpen && (
        <button
          onClick={() => setChatOpen(true)}
          style={{
            position:"fixed", bottom:90,
            right:"max(16px, calc((100vw - 480px)/2 + 16px))",
            width:52, height:52, borderRadius:"50%",
            background:"#12BFBF", border:"none", color:"#000",
            cursor:"pointer", fontSize:22, zIndex:40,
            boxShadow:"0 4px 20px rgba(18,191,191,0.35)",
            display:"flex", alignItems:"center", justifyContent:"center",
          }}>
          ◎
        </button>
      )}


            {/* Bottom nav */}
      <div style={{ position:"fixed", bottom:0, left:"50%", transform:"translateX(-50%)", width:"100%", maxWidth:480, background:"#0c0c0c", borderTop:`1px solid ${C.border}`, display:"flex", justifyContent:"space-around", padding:"10px 0 24px", zIndex:30 }}>
        {NAV.map(n => {
          const active = mainTab===n.id;
          return (
            <button key={n.id} onClick={()=>setMainTab(n.id)}
              style={{ display:"flex", flexDirection:"column", alignItems:"center", gap:4, background:"none", border:"none", cursor:"pointer", color:active?C.teal:"#333", padding:"0 16px" }}>
              {n.icon}
              <span style={{ fontSize:10 }}>{n.label}</span>
              {active && <div style={{ width:16, height:2, background:C.teal, borderRadius:1 }} />}
            </button>
          );
        })}
      </div>
    </div>
  );
}

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<Innermark />);
  </script>
  <!-- PWA Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').then(reg => {
          // Check for updates every time app loads
          reg.addEventListener('updatefound', () => {
            const newWorker = reg.installing;
            newWorker.addEventListener('statechange', () => {
              if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                // New version available — update silently
                newWorker.postMessage('SKIP_WAITING');
                window.location.reload();
              }
            });
          });
        });
      });
    }
  </script>
</body>
</html>
