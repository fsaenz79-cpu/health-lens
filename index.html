// ─── ALTITUDE HELPERS ─────────────────────────────────────────────────────────
async function getAltitudeFromCoords(lat, lng) {
  try {
    const res = await fetch(`https://api.open-meteo.com/v1/elevation?latitude=${lat}&longitude=${lng}`);
    const data = await res.json();
    return data.elevation?.[0] ?? 0;
  } catch { return 0; }
}

async function getAltitudeFromCity(city) {
  try {
    const geo = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=en&format=json`);
    const gd = await geo.json();
    if (!gd.results?.length) return null;
    const { latitude, longitude, name, country } = gd.results[0];
    const alt = await getAltitudeFromCoords(latitude, longitude);
    return { altitude: Math.round(alt), cityName: `${name}, ${country}` };
  } catch { return null; }
}

function parseLabText(rawText) {
  const results = {};
  const text = rawText.replace(/[ \t]+/g, " ").toLowerCase()
    .replace(/á/g,"a").replace(/é/g,"e").replace(/í/g,"i").replace(/ó/g,"o").replace(/ú/g,"u")
    .replace(/ñ/g,"n");
  for (const { id, kws, range } of LAB_PATTERNS) {
    let found = false;
    for (const kw of kws) {
      const kwNorm = kw.toLowerCase()
        .replace(/á/g,"a").replace(/é/g,"e").replace(/í/g,"i").replace(/ó/g,"o").replace(/ú/g,"u")
        .replace(/ñ/g,"n");
      const idx = text.indexOf(kwNorm);
      if (idx === -1) continue;
      const snippet = text.slice(idx + kwNorm.length, idx + kwNorm.length + 120);
      const numRe = /(\d+\.\d+|\d+)\s*(?:[hl]{1,2}\b)?/gi;
      let m;
      while ((m = numRe.exec(snippet)) !== null) {
        const val = parseFloat(m[1]);
        if (!isNaN(val) && val >= range[0] && val <= range[1]) {
          if (val > 1900 && val < 2100) continue;
          results[id] = String(val); found = true; break;
        }
      }
      if (found) break;
    }
  }
  return results;
}

async function extractPDFText(file, onProgress) {
  onProgress?.("Reading PDF…");
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = ({ target: { result } }) => {
      if (/\/Encrypt[\s/]/.test(result)) { reject(new Error("PDF is password-protected. Print to PDF first.")); return; }
      let text = "";
      const btRe = /BT\b([\s\S]*?)\bET\b/g;
      let block;
      while ((block = btRe.exec(result)) !== null) {
        const content = block[1];
        const litRe = /\(((?:[^\\)]|\\[\s\S])*)\)/g;
        let m;
        while ((m = litRe.exec(content)) !== null) {
          const s = m[1].replace(/\\n/g,"\n").replace(/\\r/g," ").replace(/\\t/g," ").replace(/\\\d{3}/g," ").replace(/\\(.)/g,"$1");
          if (s.trim()) text += s + " ";
        }
        const hexRe = /<([0-9a-fA-F\s]{2,})>/g;
        let h;
        while ((h = hexRe.exec(content)) !== null) {
          const hx = h[1].replace(/\s/g,"");
          let decoded = "";
          for (let i = 0; i+1 < hx.length; i += 2) {
            const cp = parseInt(hx.substr(i,2),16);
            if (cp >= 32 && cp < 127) decoded += String.fromCharCode(cp);
          }
          if (decoded.trim()) text += decoded + " ";
        }
        text += "\n";
      }
      resolve(text.trim());
    };
    reader.onerror = () => reject(new Error("Could not read file"));
    reader.readAsText(file, "latin1");
  });
}

// ─── BMI & BODY FAT HELPERS ──────────────────────────────────────────────────
function calcBMI(heightCm, weightKg) {
  if (!heightCm || !weightKg) return null;
  const h = parseFloat(heightCm) / 100;
  const w = parseFloat(weightKg);
  if (!h || !w) return null;
  return Math.round((w / (h * h)) * 10) / 10;
}

function calcBodyFat(bmi, age, sex) {
  if (!bmi || !age) return null;
  // Deurenberg formula: %BF = 1.20×BMI + 0.23×age − 10.8×sex − 5.4
  // sex: 1=male, 0=female
  const sexVal = sex === "male" ? 1 : 0;
  const bf = 1.20 * bmi + 0.23 * age - 10.8 * sexVal - 5.4;
  return Math.round(Math.max(3, bf) * 10) / 10;
}

function bmiLabel(bmi) {
  if (!bmi) return null;
  if (bmi < 18.5) return { label:"Underweight", color:"#F58300" };
  if (bmi < 25)   return { label:"Normal weight", color:"#12BFBF" };
  if (bmi < 30)   return { label:"Overweight", color:"#F58300" };
  return { label:"Obese", color:"#FF453A" };
}

function bodyFatLabel(bf, sex) {
  if (!bf) return null;
  const isMale = sex === "male";
  if (isMale) {
    if (bf < 6)  return { label:"Essential fat", color:"#F58300" };
    if (bf < 14) return { label:"Athlete", color:"#12BFBF" };
    if (bf < 18) return { label:"Fit", color:"#12BFBF" };
    if (bf < 25) return { label:"Average", color:"#888" };
    return { label:"Obese", color:"#FF453A" };
  } else {
    if (bf < 14) return { label:"Essential fat", color:"#F58300" };
    if (bf < 21) return { label:"Athlete", color:"#12BFBF" };
    if (bf < 25) return { label:"Fit", color:"#12BFBF" };
    if (bf < 32) return { label:"Average", color:"#888" };
    return { label:"Obese", color:"#FF453A" };
  }
}

// ─── HELPERS ──────────────────────────────────────────────────────────────────
function computeAnalyses(markers, values) {
  return markers.map(m => {
    const raw = values[m.id];
    if (!raw && raw !== 0) return null;
    const val = parseFloat(raw);
    if (isNaN(val)) return null;
    const result = m.evaluate(val);
    return { ...m, val, result, advice: m.advice[result.status] || [] };
  }).filter(Boolean);
}

function computeScore(analyses) {
  if (!analyses.length) return null;
  const W = { optimal:100, normal:80, borderline:55, insufficient:50, elevated:40, deficient:20, critical_low:25, critical_high:15 };
  return Math.round(analyses.reduce((s,a) => s + (W[a.result.status] ?? 50), 0) / analyses.length);
}

function fmtDate(d) {
  if (!d) return "";
  const [y,m,day] = d.split("-");
  return `${m}/${day}/${y}`;
}

function calcAge(birthDate) {
  if (!birthDate) return 35;
  const today = new Date();
  const bd = new Date(birthDate);
  let age = today.getFullYear() - bd.getFullYear();
  const m = today.getMonth() - bd.getMonth();
  if (m < 0 || (m === 0 && today.getDate() < bd.getDate())) age--;
  return Math.max(1, Math.min(120, age));
}

function scoreColor(s) {
  if (!s) return C.teal;
  if (s >= 70) return C.teal;
  if (s >= 55) return C.orange;
  return C.red;
}
function scoreLabel(s) {
  if (!s) return "";
  if (s >= 85) return "Excellent";
  if (s >= 70) return "Good";
  if (s >= 55) return "Needs attention";
  return "Requires action";
}

// ─── HALFTONE CANVAS ──────────────────────────────────────────────────────────
function drawHalftone(canvas, optimalPct) {
  const W = canvas.width, H = canvas.height;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, W, H);

  const PIXEL = 2, GAP = 1, STEP = PIXEL + GAP;

  function seededRand(seed) {
    const x = Math.sin(seed) * 43758.5453123;
    return x - Math.floor(x);
  }

  function lerpColor(t) {
    const smooth = x => x * x * (3 - 2 * x);
    let r, g, b;
    if (t <= 0.5) {
      const s = smooth(t / 0.5);
      r = Math.round(18  + s * (6  - 18));
      g = Math.round(191 + s * (6  - 191));
      b = Math.round(191 + s * (6  - 191));
    } else {
      const s = smooth((t - 0.5) / 0.5);
      r = Math.round(6  + s * (245 - 6));
      g = Math.round(6  + s * (131 - 6));
      b = Math.round(6  + s * (0   - 6));
    }
    return [r, g, b];
  }

  function density(tx, ty) {
    const hd = Math.pow(2 * Math.abs(tx - 0.5), 1.6);
    const vwave = Math.sin(ty * Math.PI * 3.5) * 0.4 + Math.sin(ty * Math.PI * 7) * 0.2 + Math.sin(ty * Math.PI * 14) * 0.1;
    const raw = hd + vwave * (1 - hd) * 0.6;
    return Math.min(Math.max(0.5 + raw * 0.5, 0), 1);
  }

  for (let row = 0; row * STEP <= H; row++) {
    for (let col = 0; col * STEP <= W; col++) {
      const x = col * STEP, y = row * STEP;
      const tx = x / W, ty = y / H;
      const colorT = Math.pow(tx, 0.85);
      const d = density(tx, ty);
      const rand = seededRand(col * 1000 + row * 0.137 + col * row * 0.031);
      const noise = seededRand(col * 7.3 + row * 13.7);
      const threshold = rand * 0.7 + noise * 0.3;
      if (d > threshold) {
        const [r, g, b] = lerpColor(colorT);
        const alpha = (0.55 + d * 0.35) * 0.70;
        ctx.fillStyle = `rgba(${r},${g},${b},${alpha})`;
        ctx.fillRect(x, y, PIXEL, PIXEL);
      }
    }
  }
}

function ScoreCard({ score, total, attention, optimal }) {
  const canvasRef = useRef(null);
  const sc = scoreColor(score);

  useEffect(() => {
    if (!canvasRef.current) return;
    const canvas = canvasRef.current;
    const rect = canvas.parentElement.getBoundingClientRect();
    canvas.width  = Math.round(rect.width  * devicePixelRatio);
    canvas.height = Math.round(rect.height * devicePixelRatio);
    canvas.style.width  = rect.width  + "px";
    canvas.style.height = rect.height + "px";
    const ctx = canvas.getContext('2d');
    ctx.scale(devicePixelRatio, devicePixelRatio);
    drawHalftone(canvas, optimal / (total || 1));
  }, [score, total, optimal]);

  return (
    <div style={{ position:"relative", borderRadius:20, border:`1px solid ${C.border}`, marginBottom:10, overflow:"hidden", background:"#060606" }}>
      <canvas ref={canvasRef} style={{ position:"absolute", inset:0, width:"100%", height:"100%", opacity:0.70 }} />
      <div style={{ position:"absolute", inset:0, background:"linear-gradient(to right,rgba(0,0,0,0.3) 0%,rgba(0,0,0,0.05) 50%,rgba(0,0,0,0.3) 100%)", pointerEvents:"none" }} />
      <div style={{ position:"relative", zIndex:2, padding:"22px 20px", display:"flex", justifyContent:"space-between", alignItems:"center" }}>
        <div>
          <div style={{ fontSize:11, color:"#888", textTransform:"uppercase", letterSpacing:"0.07em", marginBottom:4 }}>Health score</div>
          <div style={{ fontSize:80, fontWeight:300, lineHeight:1, letterSpacing:"-2px", color:sc }}>{score ?? "—"}</div>
          <div style={{ fontSize:13, color:sc, marginTop:6 }}>{scoreLabel(score)}</div>
        </div>
        <div style={{ textAlign:"right" }}>
          <div style={{ marginBottom:12 }}>
            <div style={{ fontSize:20, fontWeight:400, color:"#e8e8e8" }}>{total}</div>
            <div style={{ fontSize:10, color:"#888" }}>markers</div>
          </div>
          <div style={{ marginBottom:12 }}>
            <div style={{ fontSize:20, fontWeight:400, color:C.orange }}>{attention}</div>

          <div>
            <div style={{ fontSize:20, fontWeight:400, color:C.teal }}>{optimal}</div>
            <div style={{ fontSize:10, color:"#888" }}>optimal</div>
          </div>
        </div>
      </div>
    </div>
  );
}

// ─── TREND CHART ──────────────────────────────────────────────────────────────
function TrendChart({ marker, sessions }) {
  const canvasRef = useRef(null);
  const chartRef  = useRef(null);
  const data = sessions
    .filter(s => s.values[marker.id] !== undefined && s.values[marker.id] !== "")
    .map(s => ({ date: fmtDate(s.date), value: parseFloat(s.values[marker.id]) }))
    .filter(d => !isNaN(d.value));

  useEffect(() => {
    if (!canvasRef.current || data.length < 2) return;
    if (chartRef.current) chartRef.current.destroy();
    chartRef.current = new Chart(canvasRef.current, {
      type:"line",
      data:{ labels:data.map(d=>d.date), datasets:[{ data:data.map(d=>d.value), borderColor:C.teal, backgroundColor:C.teal+"15", borderWidth:2, pointRadius:4, pointBackgroundColor:C.teal, tension:0.3, fill:true }] },
      options:{ responsive:true, plugins:{ legend:{display:false}, tooltip:{ backgroundColor:"#1a1a1a", titleColor:"#888", bodyColor:"#fff", callbacks:{ label:ctx=>ctx.parsed.y+" "+marker.unit } } }, scales:{ x:{ grid:{color:"#1a1a1a"}, ticks:{color:"#444",font:{size:10}} }, y:{ grid:{color:"#1a1a1a"}, ticks:{color:"#444",font:{size:10}} } } }
    });
    return () => { if (chartRef.current) chartRef.current.destroy(); };
  }, [data.length, marker.id]);

  if (data.length < 2) return (
    <div style={{ height:140, display:"flex", alignItems:"center", justifyContent:"center", color:"#333", fontSize:13, background:"#0d0d0d", borderRadius:10 }}>
      {data.length === 0 ? "No data yet" : "Add 2+ tests to see trend"}
    </div>
  );
  return <canvas ref={canvasRef} height={140} />;
}

// ─── PROFILE FIELD (stable ref to prevent keyboard dismiss) ──────────────────
function ProfileField({ label, value, onChange, type="text", placeholder="" }) {
  return (
    <div>
      <div style={{ fontSize:11, color:"#888", marginBottom:6 }}>{label}</div>
      <input
        key={`pf-${label}-${value}`}
        type={type}
        defaultValue={value}
        onBlur={e => { if (e.target.value !== String(value||"")) onChange(e.target.value); }}
        placeholder={placeholder}
        style={{ width:"100%", background:"#0a0a0a", border:`1px solid ${C.border}`, borderRadius:8, padding:"8px 10px", color:"#fff", fontSize:14 }}
      />
    </div>
  );

// ─── DATE OF BIRTH PICKER ────────────────────────────────────────────────────
function DateOfBirthPicker({ value, onChange }) {
  const parsed = value ? value.split("-") : ["","",""];
  const [year, setYear]   = useState(parsed[0]||"");
  const [month, setMonth] = useState(parsed[1]||"");
  const [day, setDay]     = useState(parsed[2]||"");

  const months = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  const currentYear = new Date().getFullYear();
  const years = Array.from({length:100}, (_,i) => currentYear - i);
  const daysInMonth = (m, y) => {
    if (!m || !y) return 31;
    return new Date(Number(y), Number(m), 0).getDate();
  };
  const maxDay = daysInMonth(month, year);
  const days = Array.from({length:maxDay}, (_,i) => i+1);

  useEffect(() => {
    if (year && month && day) {
      const d = Math.min(Number(day), daysInMonth(month, year));
      const padM = String(month).padStart(2,"0");
      const padD = String(d).padStart(2,"0");
      onChange(`${year}-${padM}-${padD}`);
    }
  }, [year, month, day]);

  const sel = { background:"#0a0a0a", border:`1px solid ${C.border}`, borderRadius:8, padding:"8px 8px", color:"#fff", fontSize:13, cursor:"pointer" };

  return (
    <div style={{ display:"grid", gridTemplateColumns:"2fr 1.5fr 1fr", gap:6 }}>
      <select value={month} onChange={e=>setMonth(e.target.value)} style={sel}>
        <option value="">Month</option>
        {months.map((m,i) => <option key={i+1} value={String(i+1).padStart(2,"0")} style={{background:"#1a1a1a"}}>{m}</option>)}
      </select>
      <select value={day} onChange={e=>setDay(e.target.value)} style={sel}>
        <option value="">Day</option>
        {days.map(d => <option key={d} value={String(d).padStart(2,"0")} style={{background:"#1a1a1a"}}>{d}</option>)}
      </select>
      <select value={year} onChange={e=>setYear(e.target.value)} style={sel}>
        <option value="">Year</option>
        {years.map(y => <option key={y} value={y} style={{background:"#1a1a1a"}}>{y}</option>)}
      </select>
    </div>
  );
}

const MAYO_RANGES = {
  glucose:      { range:"70–99 mg/dL", notes:"100–125 = prediabetes; ≥126 = diabetes (ADA / Mayo Clinic)", sex:null },
  hba1c:        { range:"< 5.7%", notes:"5.7–6.4% = prediabetes; ≥6.5% = diabetes (ADA / Mayo Clinic)", sex:null },
  insulin:      { range:"< 25 µIU/mL (fasted)", notes:"Optimal target < 5 µIU/mL per functional medicine guidelines (Peter Attia)", sex:null },
  total_chol:   { range:"< 200 mg/dL", notes:"200–239 = borderline high; ≥240 = high. <200 = desirable (NCEP / Mayo Clinic)", sex:null },
  ldl:          { rangeM:"< 100 mg/dL (healthy); < 70 if heart disease", rangeF:"< 100 mg/dL (healthy); < 70 if heart disease", notes:"Optimal for healthy adults without CAD (Mayo Clinic / AHA)", sex:"both" },
  hdl:          { rangeM:"> 40 mg/dL", rangeF:"> 50 mg/dL", notes:"Higher is protective. > 60 mg/dL considered cardioprotective (Mayo Clinic)", sex:"both" },
  triglycerides:{ range:"< 150 mg/dL", notes:"150–199 = borderline high; 200–499 = high; ≥500 = very high (NCEP / Mayo Clinic)", sex:null },
  tsh:          { range:"0.4–4.0 mIU/L", notes:"Many functional medicine physicians target 0.5–2.5 mIU/L for optimal thyroid health (American Thyroid Association)", sex:null },
  free_t3:      { range:"2.3–4.1 pg/mL", notes:"Mayo Clinic reference. Optimal functional range often cited as 3.0–4.0 pg/mL", sex:null },
  free_t4:      { range:"0.8–1.8 ng/dL", notes:"Mayo Clinic reference", sex:null },
  vit_d:        { range:"20–50 ng/mL", notes:"< 20 = deficiency; < 12 = severe deficiency. Many experts target 40–60 ng/mL (Endocrine Society / Mayo Clinic)", sex:null },
  b12:          { range:"200–900 pg/mL", notes:"Mayo Clinic reference. Functional optimum often cited as 500–900 pg/mL to reduce homocysteine", sex:null },
  ferritin:     { rangeM:"12–300 ng/mL", rangeF:"10–150 ng/mL", notes:"Mayo Clinic reference. Functional target often 50–150 ng/mL for optimal iron stores (Peter Attia)", sex:"both" },
  magnesium:    { range:"1.7–2.2 mg/dL", notes:"Mayo Clinic reference. Serum magnesium reflects only ~1% of total body magnesium", sex:null },
  hscrp:        { range:"< 1.0 mg/L (low risk)", notes:"1–3 mg/L = moderate cardiovascular risk; > 3 mg/L = high risk (AHA / Mayo Clinic / JUPITER Trial)", sex:null },
  homocysteine: { range:"< 15 µmol/L", notes:"Optimal target < 7–10 µmol/L. > 15 = hyperhomocysteinemia (Mayo Clinic)", sex:null },
  alt:          { rangeM:"7–56 U/L", rangeF:"7–56 U/L", notes:"Cleveland Clinic recommends flagging > 25 U/L (F) and > 33 U/L (M) as functionally elevated", sex:"both" },
  ast:          { range:"10–40 U/L", notes:"Mayo Clinic reference", sex:null },
  creatinine:   { rangeM:"0.7–1.2 mg/dL", rangeF:"0.5–1.1 mg/dL", notes:"Mayo Clinic reference. Varies with muscle mass — athletes may run higher", sex:"both" },
  egfr:         { range:"≥ 60 mL/min/1.73m²", notes:"≥ 90 = normal; 60–89 = mildly reduced; < 60 = CKD (National Kidney Foundation / Mayo Clinic)", sex:null },
  hemoglobin:   { rangeM:"13.5–17.5 g/dL", rangeF:"12.0–15.5 g/dL", notes:"Mayo Clinic reference. Altitude raises normal range by ~0.5–2 g/dL", sex:"both" },
  hematocrit:   { rangeM:"41–53%", rangeF:"36–46%", notes:"Mayo Clinic reference. Altitude increases expected values", sex:"both" },
};

function MayoRangeTable({ markerId, sex }) {
  const data = MAYO_RANGES[markerId];
  if (!data) return <p style={{ fontSize:12, color:"#555", margin:0 }}>See your lab report's reference range for this marker.</p>;

  const isFemale = sex === "female";
  const displayRange = data.sex === "both"
    ? (isFemale ? data.rangeF : data.rangeM)
    : data.range;
  const otherRange = data.sex === "both"
    ? (isFemale ? data.rangeM : data.rangeF)
    : null;
  const otherLabel = data.sex === "both"
    ? (isFemale ? "Male reference" : "Female reference")
    : null;

  return (
    <div>
      <div style={{ marginBottom:8 }}>
        <div style={{ fontSize:11, color:"#555", marginBottom:3 }}>{sex === "female" ? "Female" : sex === "male" ? "Male" : ""} reference range</div>
        <div style={{ fontSize:16, fontWeight:500, color:"#e0e0e0", fontFamily:"monospace" }}>{displayRange}</div>
      </div>
      {otherRange && (
        <div style={{ marginBottom:8, paddingTop:8, borderTop:`0.5px solid ${C.border}` }}>
          <div style={{ fontSize:11, color:"#444", marginBottom:3 }}>{otherLabel}</div>
          <div style={{ fontSize:13, color:"#666", fontFamily:"monospace" }}>{otherRange}</div>
        </div>
      )}
      {data.notes && (
        <div style={{ paddingTop:8, borderTop:`0.5px solid ${C.border}`, fontSize:12, color:"#555", lineHeight:1.6, fontStyle:"italic" }}>
          {data.notes}
        </div>
      )}
      <div style={{ marginTop:10, fontSize:10, color:"#333", lineHeight:1.5 }}>
        Source: Mayo Clinic Medical Laboratories, AHA, NCEP, NLA, ADA guidelines
      </div>
    </div>
  );
}

// ─── MARKER DETAIL SCREEN ─────────────────────────────────────────────────────
function MarkerDetailScreen({ analysis, profile, onClose }) {
  const [step, setStep]       = useState("info"); // "info" | "questions" | "result"
  const [answers, setAnswers] = useState({});
  const info = MARKER_INFO[analysis.id];
  const col  = statusColor(analysis.result.status);
  const isOptimal = ["optimal","normal"].includes(analysis.result.status);
  const isCritical = ["critical_high","critical_low","deficient"].includes(analysis.result.status);

  // Generate tailored recommendation based on answers
  function generateRecommendation() {
    const a = answers;
    const lines = [];
    const id = analysis.id;
    const status = analysis.result.status;

    // Context-adjusted interpretation
    if (id === "glucose") {
      if (a.fasted === "Yes, but less than 8 hours" || a.fasted === "No, I had eaten recently") {
        lines.push("⚠️ Context note: Since you were not fully fasted, this glucose reading may not reflect true fasting glucose. Retest after a proper 10-12 hour fast for an accurate baseline.");
      }
      if (a.stress === "Yes, high stress/illness") {
        lines.push("Acute stress and illness raise cortisol, which directly elevates blood glucose. Your result may be artificially elevated — retest when healthy and unstressed.");
      }
    }
    if (id === "alt" || id === "ast") {
      if (a.exercise_48h === "Yes — heavy resistance training or intense cardio") {
        lines.push("Context note: Intense exercise commonly elevates ALT and AST from muscle breakdown, not liver damage. The effect can persist 48-72 hours post-exercise. Retest 72 hours after your last hard session for an accurate liver reading.");
      }
      if (a.alcohol_week === "More than 7 drinks") {
        lines.push("Alcohol above 7 drinks per week is a significant driver of elevated liver enzymes. A 4-week alcohol-free period followed by a retest will clarify the contribution of alcohol to your results.");
      }
    }
    if (id === "triglycerides") {
      if (a.fasted === "8 hours or less" || a.fasted === "I had eaten") {
        lines.push("Critical context: Triglycerides are extremely sensitive to recent food intake. A non-fasted sample can read 2-3x higher than true fasting levels. This result requires confirmation with a 10-12 hour fasted sample before acting on it.");
        return lines;
      }
      if (a.alcohol_recent === "Yes — significant amount") {
        lines.push("Alcohol in the 48 hours before the test significantly elevates triglycerides — often by 50-100 mg/dL. Retest after 48 hours alcohol-free for your true baseline.");
      }
    }
    if (id === "creatinine") {
      if (a.hydration === "I may have been dehydrated" || a.hydration === "I exercised heavily without enough fluid replacement") {
        lines.push("Dehydration concentrates creatinine in the blood, producing a falsely elevated reading. Rehydrate fully and retest — drink 2L+ of water on the day of your next test.");
      }
    }
    if (id === "hemoglobin" && a.menstruation === "Yes — very heavy flow") {
      lines.push("Heavy menstrual periods are the most common cause of iron-deficiency anemia in women. Your hemoglobin result should be evaluated together with ferritin and serum iron to determine if iron supplementation is needed.");
    }
    if (id === "tsh" && a.time_of_draw && a.time_of_draw !== "Morning (before 10am)" && a.time_of_draw !== "Not sure") {
      lines.push("TSH is highest in the morning and declines through the day. An afternoon draw can read 0.5-1.0 mIU/L lower than a morning draw — always test TSH in the morning for consistent tracking.");
    }
    if (id === "vit_d" && a.skin_tone === "Dark / deep") {
      lines.push("Darker skin tones require significantly more UVB sun exposure to produce the same amount of Vitamin D as lighter skin — up to 6x more time in the sun. Supplementation is particularly important.");
    }
    if (id === "ldl" && a.fasted === "No, I had eaten") {
      lines.push("LDL from a non-fasted sample may be slightly different from a fasted result. However, a fasted sample is preferred for the most accurate lipid panel. Retest fasted if possible.");
    }

    // Primary recommendations based on status
    const adviceList = analysis.advice || [];
    if (adviceList.length > 0) {
      lines.push(...adviceList.slice(0,3));
    }

    // Escalation if still critical after context
    const contextExplains = lines.some(l => l.includes("Context note") || l.includes("Retest") || l.includes("Rehydrate"));
    if (isCritical && !contextExplains) {
      lines.push("🩺 We recommend consulting with a specialist (endocrinologist, cardiologist, or your primary care physician) to evaluate this result in the context of your full medical history.");
    } else if (isCritical && contextExplains) {
      lines.push("If after retesting under proper conditions this marker remains in the critical range, please consult a specialist for further evaluation.");
    }

    return lines;
  }

  const recommendation = step === "result" ? generateRecommendation() : [];
  const questions = info?.questions || [];
  const allAnswered = questions.every(q => answers[q.id]);

  return (
    <div style={{ position:"fixed", inset:0, background:C.bg, zIndex:100, overflowY:"auto" }}>
      {/* Header */}
      <div style={{ padding:"52px 20px 16px", display:"flex", alignItems:"center", gap:14, borderBottom:`1px solid ${C.border}`, background:"#0c0c0c" }}>
        <button onClick={onClose} style={{ background:"transparent", border:"none", color:"#666", cursor:"pointer", fontSize:18, padding:0, lineHeight:1 }}>←</button>
        <div style={{ flex:1 }}>
          <div style={{ fontSize:12, color:"#444" }}>{CATEGORIES.find(c=>analysis.category===c.id)?.label}</div>
          <div style={{ fontSize:20, fontWeight:500, letterSpacing:"-0.3px" }}>{analysis.name}</div>
        </div>
        <div style={{ textAlign:"right" }}>
          <div style={{ fontSize:28, fontWeight:400, color:col }}>{analysis.val}</div>
          <div style={{ fontSize:11, color:"#555" }}>{analysis.unit}</div>
        </div>
      </div>

      <div style={{ padding:"20px 20px 100px" }}>

        {/* Status badge */}
        <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:20, padding:"12px 16px", borderRadius:12, background:col+"10", border:`1px solid ${col}25` }}>
          <div style={{ width:10, height:10, borderRadius:"50%", background:col, flexShrink:0 }} />
          <div style={{ flex:1 }}>
            <div style={{ fontSize:13, fontWeight:500, color:col }}>{STATUS_LABEL[analysis.result.status]}</div>
            <div style={{ fontSize:11, color:"#666", marginTop:1 }}>Your value: {analysis.val} {analysis.unit}</div>
          </div>
        </div>

        {/* Step: INFO */}
        {step === "info" && info && (
          <>
            <Section title="What is it?">
              <p style={{ fontSize:14, color:"#aaa", lineHeight:1.7, margin:0 }}>{info.what}</p>
            </Section>

            <Section title="Why does it matter?">
              <p style={{ fontSize:14, color:"#aaa", lineHeight:1.7, margin:0 }}>{info.why}</p>
            </Section>

            {info.longTerm && info.longTerm[analysis.result.status] && (
              <Section title="Long-term implications">
                <p style={{ fontSize:14, color:"#aaa", lineHeight:1.7, margin:0 }}>{info.longTerm[analysis.result.status]}</p>
              </Section>
            )}

            <Section title="Reference ranges (Mayo Clinic)">
              <MayoRangeTable markerId={analysis.id} sex={profile.sex} />
            </Section>

            <Section title="Source">
              <p style={{ fontSize:12, color:"#555", lineHeight:1.6, margin:0, fontStyle:"italic" }}>{info.source}</p>
              <div style={{ marginTop:10, padding:"8px 10px", background:"#0a0a0a", borderRadius:8, fontSize:11, color:"#444", lineHeight:1.6 }}>
                ⚠️ Reference ranges reflect where 95% of healthy people fall — 5% of healthy individuals will have results outside the range without any underlying condition. These are population averages; personalized ranges accounting for your age, sex, altitude, and lifestyle are more meaningful for tracking your health over time.
              </div>
            </Section>

            {isOptimal ? (
              <div style={{ background:C.teal+"10", border:`1px solid ${C.teal}25`, borderRadius:14, padding:"14px 16px" }}>
                <div style={{ fontSize:13, fontWeight:500, color:C.teal, marginBottom:6 }}>Looking great</div>
                {analysis.advice.slice(0,2).map((tip,i) => <div key={i} style={{ fontSize:13, color:"#888", lineHeight:1.6 }}>{tip}</div>)}
              </div>
            ) : (
              <button onClick={()=>setStep("questions")}
                style={{ width:"100%", padding:"13px 0", borderRadius:14, background:C.teal, border:"none", color:"#000", cursor:"pointer", fontSize:14, fontWeight:500 }}>
                Get personalized recommendations →
              </button>
            )}
          </>
        )}

        {/* Step: QUESTIONS */}
        {step === "questions" && (
          <>
            <div style={{ fontSize:14, color:"#666", marginBottom:20, lineHeight:1.6 }}>
              To give you accurate, context-aware recommendations, answer a few quick questions about this test.
            </div>
            {questions.map(q => (
              <div key={q.id} style={{ marginBottom:20 }}>
                <div style={{ fontSize:14, fontWeight:500, color:"#ccc", marginBottom:10, lineHeight:1.5 }}>{q.text}</div>
                <div style={{ display:"flex", flexDirection:"column", gap:6 }}>
                  {q.options.map(opt => (
                    <button key={opt} onClick={()=>setAnswers(a=>({...a,[q.id]:opt}))}
                      style={{ padding:"10px 14px", borderRadius:10, border:`1px solid ${answers[q.id]===opt?C.teal:C.border}`, background:answers[q.id]===opt?C.teal+"15":"transparent", color:answers[q.id]===opt?C.teal:"#888", cursor:"pointer", fontSize:13, textAlign:"left" }}>
                      {opt}
                    </button>
                  ))}
                </div>
              </div>
            ))}
            <button onClick={()=>setStep("result")} disabled={!allAnswered}
              style={{ width:"100%", padding:"13px 0", borderRadius:14, background:C.teal, border:"none", color:"#000", cursor:"pointer", fontSize:14, fontWeight:500, opacity:allAnswered?1:0.4 }}>
              See my recommendations →
            </button>
          </>
        )}

        {/* Step: RESULT */}
        {step === "result" && (
          <>
            <Section title="Your personalized recommendations">
              <div style={{ display:"flex", flexDirection:"column", gap:10 }}>
                {recommendation.map((tip,i) => (
                  <div key={i} style={{ fontSize:13, color:"#aaa", lineHeight:1.7, padding:"10px 14px", background:"#111", borderRadius:10, border:`1px solid ${C.border}` }}>
                    {tip}
                  </div>
                ))}
              </div>
            </Section>

            {info?.source && (
              <div style={{ marginTop:16, padding:"10px 14px", borderRadius:10, background:"#0a0a0a", border:`1px solid ${C.border}` }}>
                <div style={{ fontSize:11, color:"#444", fontStyle:"italic" }}>Based on: {info.source}</div>
              </div>
            )}

            <button onClick={()=>setStep("questions")} style={{ width:"100%", marginTop:16, padding:"11px 0", borderRadius:12, background:"transparent", border:`1px solid ${C.border}`, color:"#666", cursor:"pointer", fontSize:13 }}>
              ← Revise answers
            </button>
          </>
        )}
      </div>
    </div>
  );
}

function Section({ title, children }) {
  return (
    <div style={{ marginBottom:20 }}>
      <div style={{ fontSize:11, color:"#555", textTransform:"uppercase", letterSpacing:"0.07em", marginBottom:8 }}>{title}</div>
      <div style={{ background:C.card, borderRadius:14, border:`1px solid ${C.border}`, padding:"14px 16px" }}>
        {children}
      </div>
    </div>
  );
}

// ─── IMPORT MODAL ─────────────────────────────────────────────────────────────
function ImportModal({ state, onToggle, onApply, onAnalyzeText, onClose }) {
  const { status, progress, detected, imageUrl, error } = state;
  const found    = detected.filter(d => d.value !== null);
  const notFound = detected.filter(d => d.value === null);
  const [pasteText, setPasteText] = useState("");

  const subtitle =
    status === "loading" ? progress || "Processing…"
    : status === "done" ? `Detected ${found.length} of ${detected.length} markers`
    : status === "image_only" ? "Image loaded — enter values manually"
    : status === "paste" ? "Paste your lab report text below"
    : status === "error" ? "Could not read file"
    : "Preparing…";

  return (
    <div style={{ position:"fixed", inset:0, zIndex:50, display:"flex", alignItems:"center", justifyContent:"center", padding:16, background:"rgba(0,0,0,0.85)" }}>
      <div style={{ background:"#111", borderRadius:20, border:`1px solid ${C.border}`, width:"100%", maxWidth:440, maxHeight:"90vh", display:"flex", flexDirection:"column", overflow:"hidden" }}>
        <div style={{ padding:"16px 20px", borderBottom:`1px solid ${C.border}`, display:"flex", alignItems:"center", justifyContent:"space-between" }}>
          <div>
            <div style={{ fontSize:15, fontWeight:500 }}>Import lab report</div>
            <div style={{ fontSize:12, color:"#555", marginTop:2 }}>{subtitle}</div>
          </div>
          <button onClick={onClose} style={{ width:28, height:28, borderRadius:"50%", background:"#1a1a1a", border:"none", color:"#666", cursor:"pointer", fontSize:14 }}>✕</button>
        </div>
        <div style={{ overflowY:"auto", flex:1, padding:20 }}>
          {status === "loading" && (
            <div style={{ display:"flex", flexDirection:"column", alignItems:"center", padding:"40px 0", gap:16 }}>
              <div style={{ width:48, height:48, borderRadius:"50%", border:`3px solid ${C.border}`, borderTopColor:C.teal, animation:"spin 1s linear infinite" }} />
              <style>{`@keyframes spin{to{transform:rotate(360deg)}}`}</style>
              <div style={{ fontSize:13, color:"#666", textAlign:"center" }}>{progress || "Analyzing your lab report…"}</div>
            </div>
          )}
          {status === "error" && (
            <div style={{ background:"#FF453A15", border:`1px solid #FF453A30`, borderRadius:12, padding:"12px 14px", fontSize:13, color:C.red }}>
              <div style={{ fontWeight:500, marginBottom:4 }}>Could not read file</div>
              <div style={{ color:"#FF453A99" }}>{error}</div>
            </div>
          )}
          {status === "image_only" && imageUrl && (
            <div>
              <div style={{ background:"#F5830015", border:`1px solid #F5830030`, borderRadius:12, padding:"10px 12px", fontSize:12, color:C.orange, marginBottom:12 }}>
                {error}
              </div>
              <img src={imageUrl} alt="Lab report" style={{ width:"100%", borderRadius:12 }} />
            </div>
          )}
          {status === "done" && (
            <div>
              {found.length > 0 && (
                <>
                  <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:10 }}>
                    <div style={{ fontSize:13, fontWeight:500 }}>Detected values <span style={{ color:"#444" }}>({found.length})</span></div>
                    <div style={{ display:"flex", gap:12, fontSize:12 }}>
                      <button onClick={() => onToggle("all",true)} style={{ color:C.teal, background:"none", border:"none", cursor:"pointer", padding:0 }}>All</button>
                      <button onClick={() => onToggle("all",false)} style={{ color:"#444", background:"none", border:"none", cursor:"pointer", padding:0 }}>None</button>
                    </div>
                  </div>
                  <div style={{ display:"flex", flexDirection:"column", gap:6, marginBottom:16 }}>
                    {found.map(d => (
                      <label key={d.id} style={{ display:"flex", alignItems:"center", gap:12, padding:"10px 12px", borderRadius:10, border:`1px solid ${d.checked ? C.teal+"40":"#1e1e1e"}`, background:d.checked ? C.teal+"08":"transparent", cursor:"pointer" }}>
                        <input type="checkbox" checked={d.checked} onChange={e => onToggle(d.id, e.target.checked)} style={{ accentColor:C.teal }} />
                        <span style={{ flex:1, fontSize:13 }}>{d.name}</span>
                        <span style={{ fontSize:13, fontWeight:500, color:C.teal }}>{d.value} <span style={{ fontSize:11, color:"#444" }}>{d.unit}</span></span>

              {found.length === 0 && (
                <div style={{ background:"#F5830015", border:`1px solid #F5830030`, borderRadius:12, padding:"12px 14px", fontSize:13, color:C.orange }}>

              )}
              {notFound.length > 0 && (
                <details style={{ marginTop:8 }}>

                value={pasteText}
                onChange={e => setPasteText(e.target.value)}

          )}
        </div>
        <div style={{ padding:"12px 20px", borderTop:`1px solid ${C.border}`, display:"flex", gap:8 }}>
          <button onClick={onClose} style={{ flex:1, padding:"10px 0", borderRadius:10, background:"transparent", border:`1px solid ${C.border}`, color:"#666", cursor:"pointer", fontSize:13 }}>Cancel</button>
          {status === "paste" && (
            <button
              onClick={() => {
                if (pasteText.trim()) {
                  const parsed = parseLabText(pasteText);
                  const detected = LAB_PATTERNS.map(p=>({ id:p.id, name:p.name, unit:p.unit, value:parsed[p.id]??null, checked:!!parsed[p.id] }));
                  onAnalyzeText(detected);
                  setPasteText("");
                }
              }}
              style={{ flex:1, padding:"10px 0", borderRadius:10, background:C.teal, border:"none", color:"#000", cursor:"pointer", fontSize:13, fontWeight:500 }}
            >Analyze</button>
          )}
          {status === "done" && found.filter(d=>d.checked).length > 0 && (
            <button onClick={onApply} style={{ flex:1, padding:"10px 0", borderRadius:10, background:C.teal, border:"none", color:"#000", cursor:"pointer", fontSize:13, fontWeight:500 }}>
              Apply {found.filter(d=>d.checked).length} values
            </button>
          )}
        </div>
      </div>
    </div>
  );
}

          <div style={{ fontSize:15, fontWeight:500, color:"#fff" }}>Innermark AI</div>
          <div style={{ fontSize:11, color:"#444" }}>Your holistic health intelligence</div>

      </div>

      <div style={{ flex:1, overflowY:"auto", padding:"16px 20px", display:"flex", flexDirection:"column", gap:12 }}>
        {messages.length === 0 && (
          <div style={{ textAlign:"center", padding:"40px 0" }}>
            <div style={{ fontSize:32, marginBottom:12 }}>◎</div>
            <div style={{ fontSize:15, fontWeight:500, color:"#fff", marginBottom:8 }}>Hi, I'm your Innermark AI</div>
            <div style={{ fontSize:13, color:"#555", lineHeight:1.6, marginBottom:20 }}>I know your biomarkers, fitness data, and health profile. Ask me anything.</div>
            <div style={{ display:"flex", flexDirection:"column", gap:8 }}>

                <button key={q} onClick={() => onSend(q)}

                {m.content}
              </div>
            </div>
          );

          // Normalize content — can be string or array of blocks
          const renderContent = (content) => {
            if (typeof content === "string") return <span style={{ whiteSpace:"pre-wrap" }}>{content}</span>;
            if (Array.isArray(content)) return (
              <div style={{ display:"flex", flexDirection:"column", gap:6 }}>
                {content.map((block, bi) => {
                  if (block.type === "image") return (
                    <img key={bi} src={`data:${block.source.media_type};base64,${block.source.data}`}
                      alt="uploaded" style={{ maxWidth:"100%", borderRadius:8, display:"block" }} />
                  );
                  if (block.type === "text") return (

        {/* WhatsApp-style input row */}

            <input

          {/* Right side: mic + camera when no text; send when typing */}

            <div style={{ display:"flex", gap:6, alignItems:"center" }}>
              {/* Camera — opens camera directly */}
              <label htmlFor="chat-camera-input"

          ) : (

            <button onClick={() => onSend(input)} disabled={loading}

              ↑

          )}
        </div>
      </div>
      <style>{`@keyframes bounce{0%,80%,100%{transform:scale(0)}40%{transform:scale(1)}} @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}`}</style>
    </div>
  );
}

function getDailyQuote(profile) {
  const isAthlete = (profile?.exerciseHours || 0) >= 8;
  const pool = isAthlete
    ? [...QUOTES_ATHLETE, ...QUOTES_HEALTH]
    : [...QUOTES_HEALTH, ...QUOTES_GENERAL];
  const dayOfYear = Math.floor((Date.now() - new Date(new Date().getFullYear(),0,0)) / 86400000);
  return pool[dayOfYear % pool.length];
}

function LoginScreen() {

  const [loading, setLoading]   = useState(false);
  const [mode, setMode]         = useState("signin");
  const [resetSent, setResetSent] = useState(false);

  const cleanErr = msg => {
    if (msg.includes("Invalid login credentials")) return "Incorrect email or password.";
    if (msg.includes("User already registered"))   return "An account with this email already exists.";
    if (msg.includes("Password should be"))        return "Password must be at least 6 characters.";
    return msg;
  };

  const handleEmail = async () => {
    if (!email || !password) return;
    setLoading(true); setError("");
    const fn = mode === "signup"
      ? sbClient.auth.signUp({ email, password })
      : sbClient.auth.signInWithPassword({ email, password });
    const { error:e } = await fn;
    if (e) { setError(cleanErr(e.message)); setLoading(false); }
  };

// ─── DUAL AXIS CHART ─────────────────────────────────────────────────────────
function DualAxisChart({ data1, data2, label1, label2, unit1, unit2, granularity = "auto", timeRange = 90 }) {
  const canvasRef = useRef(null);
  const chartRef  = useRef(null);

  useEffect(() => {
    if (!canvasRef.current || data1.length < 1) return;
    if (chartRef.current) chartRef.current.destroy();

    // Smart time grouping based on granularity setting
    const maxLen = Math.max(data1.length, data2.length);
    const autoGroupBy = timeRange >= 180 ? "month" : timeRange >= 60 ? "week" : "day";
    const groupBy = granularity === "auto" ? autoGroupBy : granularity;

    const getGroupKey = (dateStr) => {
      if (groupBy === "month") return dateStr.slice(0, 7); // YYYY-MM
      if (groupBy === "week") {
        const d = new Date(dateStr);
        const day = d.getDay();
        const diff = d.getDate() - day + (day === 0 ? -6 : 1);
        const mon = new Date(d); mon.setDate(diff);
        return mon.toISOString().split("T")[0];
      }
      return dateStr;
    };

    const groupData = (data) => {
      if (groupBy === "day" || data.length === 0) return data;
      const groups = {};
      data.forEach(d => {
        const key = getGroupKey(d.date);
        if (!groups[key]) groups[key] = [];
        groups[key].push(d.value);
      });
      return Object.entries(groups).sort().map(([key, vals]) => ({
        date: key,
        value: Math.round(vals.reduce((a,b)=>a+b,0)/vals.length * 100) / 100,
      }));
    };

    const norm1 = groupData(data1);
    const norm2 = groupData(data2);

    const allDates = [...new Set([...norm1.map(d=>d.date), ...norm2.map(d=>d.date)])].sort();
    const map1 = Object.fromEntries(norm1.map(d=>[d.date,d.value]));
    const map2 = Object.fromEntries(norm2.map(d=>[d.date,d.value]));

    const formatLabel = (dateStr) => {
      if (groupBy === "month") {
        const [y, m] = dateStr.split("-");
        return new Date(Number(y), Number(m)-1).toLocaleString("default",{month:"short",year:"2-digit"});
      }
      if (groupBy === "week") {
        // Show as "May 1" style
        const d = new Date(dateStr + "T00:00:00");
        return d.toLocaleString("default",{month:"short",day:"numeric"});
      }
      // Day: show as "May 1"
      const d = new Date(dateStr + "T00:00:00");
      return d.toLocaleString("default",{month:"short",day:"numeric"});
    };

    const datasets = [{
      label: label1,
      data: allDates.map(d => map1[d] ?? null),
      borderColor: "#12BFBF",
      backgroundColor: "#12BFBF20",
      borderWidth: 2,
      pointRadius: allDates.length > 30 ? 2 : 4,
      pointBackgroundColor: "#12BFBF",
      tension: 0.3,
      fill: false,
      yAxisID: "y1",
      spanGaps: true,
    }];

    if (norm2.length > 0) {
      datasets.push({
        label: label2,
        data: allDates.map(d => map2[d] ?? null),
        borderColor: "#F58300",
        backgroundColor: "#F5830020",
        borderWidth: 2,
        pointRadius: allDates.length > 30 ? 2 : 4,
        pointBackgroundColor: "#F58300",
        tension: 0.3,
        fill: false,
        yAxisID: "y2",
        spanGaps: true,
      });
    }

    const scales = {
      x: { grid:{color:"#1a1a1a"}, ticks:{color:"#444",font:{size:9}, maxTicksLimit:8} },
      y1: { position:"left", grid:{color:"#1a1a1a"}, ticks:{color:"#12BFBF",font:{size:9}}, title:{display:!!unit1,text:unit1,color:"#12BFBF",font:{size:9}} },
    };
    if (norm2.length > 0) {
      scales.y2 = { position:"right", grid:{drawOnChartArea:false}, ticks:{color:"#F58300",font:{size:9}}, title:{display:!!unit2,text:unit2,color:"#F58300",font:{size:9}} };
    }

    chartRef.current = new Chart(canvasRef.current, {
      type: "line",
      data: { labels: allDates.map(d=>formatLabel(d)), datasets },
      options: {
        responsive: true,
        interaction: { mode:"index", intersect:false },
        plugins: {
          legend: { display:false },
          tooltip: {
            backgroundColor:"#1a1a1a",
            titleColor:"#888",
            bodyColor:"#fff",
            callbacks: {
              label: ctx => `${ctx.dataset.label}: ${ctx.parsed.y} ${ctx.datasetIndex===0?unit1:unit2}`
            }
          }
        },
        scales,
      }
    });
    return () => { if (chartRef.current) chartRef.current.destroy(); };
  }, [data1.length, data2.length, label1, label2, granularity, timeRange]);

  if (data1.length < 1) return (
    <div style={{ height:160, display:"flex", alignItems:"center", justifyContent:"center", color:"#333", fontSize:13 }}>
      No data yet
    </div>
  );
  return <canvas ref={canvasRef} height={160} />;
}

// ─── FITNESS CHART ────────────────────────────────────────────────────────────
function FitnessChart({ metrics }) {

function TrendsTab({ sessions, fitnessMetrics, weightHistory, markers, profile, customMetrics = [] }) {
  const [metric1, setMetric1]   = useState("glucose");
  const [metric2, setMetric2]   = useState(null);
  const [timeRange, setTimeRange] = useState(90);   // days: 7, 30, 90, 360
  const [granularity, setGranularity] = useState("auto"); // "auto" | "day" | "week" | "month"


  const ALL_METRICS = [
    { group:"Health", options: markers.map(m => ({ id:m.id, label:m.name, unit:m.unit, type:"health" })) },
    { group:"Fitness", options: [
      { id:"vo2_max",         label:"VO2 Max",            unit:"ml/kg/min", type:"fitness" },
      { id:"hrv",             label:"HRV",                unit:"ms",    type:"fitness" },
      { id:"resting_hr",      label:"Avg training HR",    unit:"bpm",   type:"fitness" },
      { id:"sleep_hours",     label:"Sleep",              unit:"hrs",   type:"fitness" },
      { id:"steps",           label:"Steps",              unit:"steps", type:"fitness" },
      { id:"calories_burned", label:"Calories burned",    unit:"kcal",  type:"fitness" },
      { id:"active_minutes",  label:"Daily avg active",   unit:"min",   type:"fitness" },
      { id:"spo2",            label:"SpO2",               unit:"%",     type:"fitness" },
      { id:"stress_score",    label:"Stress",             unit:"/100",  type:"fitness" },
      { id:"body_fat",        label:"Body fat (est.)",    unit:"%",     type:"fitness" },
    ].filter(m => fitnessMetrics.some(fm => fm[m.id] !== null && fm[m.id] !== undefined)) },
    { group:"Weight & Body", options: [
      { id:"weight_kg", label:"Body weight", unit:"kg", type:"weight" },
      ...(profile?.height ? [{ id:"bmi", label:"BMI", unit:"kg/m²", type:"computed" }] : []),
      ...(profile?.height ? [{ id:"body_fat", label:"Body fat (est.)", unit:"%", type:"computed" }] : []),
    ] },
    ...((() => {
      const customNames = [...new Set(customMetrics.map(m => m.metric_name))];
      if (customNames.length === 0) return [];
      return [{ group:"Custom", options: customNames.map(name => {
        const sample = customMetrics.find(m => m.metric_name === name);
        return { id:`custom:${name}`, label: name.replace(/_/g," ").replace(/\w/g,c=>c.toUpperCase()), unit: sample?.metric_unit || "", type:"custom", metricName: name };
      })}];
    })()),
  ].filter(g => g.options.length > 0);

  // Apply time range filter
  const cutoffDate = (() => {
    const d = new Date();
    d.setDate(d.getDate() - timeRange);
    return d.toISOString().split("T")[0];
  })();

  const getDataPoints = (metricId, type) => {
    if (type === "health") {
      return sessions
        .filter(s => s.values[metricId] !== undefined && s.values[metricId] !== "" && s.date >= cutoffDate)
        .map(s => ({ date: s.date, value: parseFloat(s.values[metricId]) }))
        .filter(d => !isNaN(d.value));
    }
    if (type === "fitness") {
      return fitnessMetrics
        .filter(m => m[metricId] !== null && m[metricId] !== undefined && m.date >= cutoffDate)
        .map(m => ({ date: m.date, value: parseFloat(m[metricId]) }));
    }
    if (type === "weight") {
      // Use history if available, fallback to profile weight as single point
      if (weightHistory.length > 0) {
        return weightHistory.map(w => ({ date: w.date, value: parseFloat(w.weight_kg) }));
      }
      if (profile?.weight) {
        return [{ date: new Date().toISOString().split("T")[0], value: parseFloat(profile.weight) }];
      }
      return [];
    }
    if (type === "custom") {
      const metricName = metricId.replace("custom:", "");
      return customMetrics
        .filter(m => m.metric_name === metricName)
        .map(m => ({ date: m.date, value: parseFloat(m.value) }))
        .sort((a,b) => a.date.localeCompare(b.date));
    }
    if (type === "computed") {
      const entries = weightHistory.length > 0
        ? weightHistory.map(w => ({ date: w.date, weight: parseFloat(w.weight_kg) }))
        : profile?.weight
          ? [{ date: new Date().toISOString().split("T")[0], weight: parseFloat(profile.weight) }]
          : [];
      return entries.map(e => {
        const bmi = calcBMI(profile?.height, e.weight);
        if (metricId === "bmi") return bmi ? { date: e.date, value: bmi } : null;
        if (metricId === "body_fat") {
          const bf = calcBodyFat(bmi, profile?.age || 35, profile?.sex || "male");
          return bf ? { date: e.date, value: bf } : null;
        }
        return null;
      }).filter(Boolean);
    }
    return [];
  };

  const findMetric = (id) => {
    for (const g of ALL_METRICS) {
      const m = g.options.find(o => o.id === id);
      if (m) return m;
    }
    // Fallback for custom metrics
    if (id.startsWith("custom:")) {
      const name = id.replace("custom:", "");
      const sample = customMetrics.find(m => m.metric_name === name);
      return { id, label: name.replace(/_/g," "), unit: sample?.metric_unit || "", type:"custom", metricName: name };
    }
    return null;
  };

  const m1 = findMetric(metric1);
  const m2 = metric2 ? findMetric(metric2) : null;
  const data1 = m1 ? getDataPoints(metric1, m1.type) : [];
  const data2 = m2 ? getDataPoints(metric2, m2.type) : [];
  const C = { teal:"#12BFBF", orange:"#F58300", red:"#FF453A", bg:"#080808", card:"#111111", border:"#1E1E1E" };

  return (
    <div style={{ paddingBottom:100 }}>
      {/* Time filters */}
      <div style={{ marginBottom:12 }}>
        <div style={{ display:"flex", gap:4, marginBottom:6 }}>
          {[7,30,90,360].map(d => (
            <button key={d} onClick={()=>setTimeRange(d)}
              style={{ flex:1, padding:"6px 0", borderRadius:8, border:`1px solid ${timeRange===d?C.teal:C.border}`,
                background:timeRange===d?C.teal+"18":"transparent",
                color:timeRange===d?C.teal:"#555", cursor:"pointer", fontSize:12, fontWeight:timeRange===d?500:400 }}>
              {d === 360 ? "1y" : `${d}d`}
            </button>
          ))}
        </div>
        <div style={{ display:"flex", gap:4 }}>
          {[{id:"auto",label:"Auto"},{id:"day",label:"Day"},{id:"week",label:"Week"},{id:"month",label:"Month"}].map(g => (
            <button key={g.id} onClick={()=>setGranularity(g.id)}
              style={{ flex:1, padding:"5px 0", borderRadius:8, border:`1px solid ${granularity===g.id?C.teal:C.border}`,
                background:granularity===g.id?C.teal+"18":"transparent",
                color:granularity===g.id?C.teal:"#555", cursor:"pointer", fontSize:11 }}>
              {g.label}
            </button>
          ))}
        </div>
      </div>

      <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:8, marginBottom:12 }}>
        <div>
          <div style={{ fontSize:10, color:"#555", textTransform:"uppercase", letterSpacing:"0.07em", marginBottom:6 }}>Primary</div>
          <select value={metric1} onChange={e=>setMetric1(e.target.value)}
            style={{ width:"100%", background:"#111", border:`1px solid ${C.teal}40`, borderRadius:8, padding:"8px 10px", color:C.teal, fontSize:13, cursor:"pointer" }}>
            {ALL_METRICS.map(g => (
              <optgroup key={g.group} label={g.group}>
                {g.options.map(o => <option key={o.id} value={o.id} style={{ background:"#1a1a1a" }}>{o.label}</option>)}
              </optgroup>
            ))}
          </select>
        </div>
        <div>
          <div style={{ fontSize:10, color:"#555", textTransform:"uppercase", letterSpacing:"0.07em", marginBottom:6 }}>Overlay</div>
          <select value={metric2||""} onChange={e=>setMetric2(e.target.value||null)}
            style={{ width:"100%", background:"#111", border:`1px solid ${C.orange}40`, borderRadius:8, padding:"8px 10px", color:metric2?C.orange:"#444", fontSize:13, cursor:"pointer" }}>
            <option value="">None</option>
            {ALL_METRICS.map(g => (
              <optgroup key={g.group} label={g.group}>
                {g.options.filter(o=>o.id!==metric1).map(o => <option key={o.id} value={o.id} style={{ background:"#1a1a1a" }}>{o.label}</option>)}
              </optgroup>
            ))}
          </select>
        </div>
      </div>

      <div style={{ background:C.card, borderRadius:16, border:`1px solid ${C.border}`, padding:16, marginBottom:12 }}>
        <div style={{ display:"flex", gap:16, alignItems:"center", marginBottom:12 }}>
          <div style={{ display:"flex", alignItems:"center", gap:6 }}>
            <div style={{ width:10, height:10, borderRadius:2, background:C.teal }} />
            <span style={{ fontSize:12, color:"#888" }}>{m1?.label} ({m1?.unit})</span>
          </div>
          {m2 && (
            <div style={{ display:"flex", alignItems:"center", gap:6 }}>
              <div style={{ width:10, height:10, borderRadius:2, background:C.orange }} />
              <span style={{ fontSize:12, color:"#888" }}>{m2?.label} ({m2?.unit})</span>
            </div>
          )}
        </div>
        <DualAxisChart data1={data1} data2={data2} label1={m1?.label||""} label2={m2?.label||""} unit1={m1?.unit||""} unit2={m2?.unit||""} granularity={granularity} timeRange={timeRange} />
      </div>

      {data1.length > 0 && (
        <div style={{ display:"grid", gridTemplateColumns:m2&&data2.length>0?"1fr 1fr":"1fr", gap:8 }}>
          {[{ data:data1, label:m1?.label, unit:m1?.unit, color:C.teal }, ...(m2&&data2.length>0?[{ data:data2, label:m2?.label, unit:m2?.unit, color:C.orange }]:[])].map((d,i) => {
            const vals = d.data.map(x=>x.value);
            if (!vals.length) return null;
            const avg = Math.round(vals.reduce((a,b)=>a+b,0)/vals.length*10)/10;
            const min = Math.min(...vals);
            const max = Math.max(...vals);
            return (
              <div key={i} style={{ background:C.card, borderRadius:12, border:`1px solid ${C.border}`, padding:"12px 14px" }}>
                <div style={{ fontSize:11, color:d.color, textTransform:"uppercase", letterSpacing:"0.06em", marginBottom:8 }}>{d.label}</div>
                <div style={{ display:"flex", justifyContent:"space-between" }}>
                  <div><div style={{ fontSize:10, color:"#444" }}>Avg</div><div style={{ fontSize:16, color:"#fff" }}>{avg}<span style={{ fontSize:10, color:"#444" }}> {d.unit}</span></div></div>
                  <div><div style={{ fontSize:10, color:"#444" }}>Min</div><div style={{ fontSize:16, color:"#fff" }}>{min}<span style={{ fontSize:10, color:"#444" }}> {d.unit}</span></div></div>
                  <div><div style={{ fontSize:10, color:"#444" }}>Max</div><div style={{ fontSize:16, color:"#fff" }}>{max}<span style={{ fontSize:10, color:"#444" }}> {d.unit}</span></div></div>
                </div>
              </div>
            );
          })}
        </div>
      )}

      {data1.length === 0 && (
        <div style={{ textAlign:"center", padding:"40px 0", color:"#444" }}>
          <div style={{ fontSize:14 }}>No data for this metric yet</div>
          <div style={{ fontSize:12, color:"#333", marginTop:6 }}>Add fitness data via Innerpilot to see trends</div>
        </div>
      )}
      <MedicalDisclaimer />
    </div>
  );
}




// ── CYCLE TAB (top-level component) ─────────────────────────────────────────
function CycleTab({ cycleLog, setCycleLog, user, sbClient, C }) {
  const today = new Date().toISOString().split("T")[0];
  const [selectedDay, setSelectedDay] = useState(today);
  const [saving, setSaving] = useState(false);
  const [saveMsg, setSaveCycleMsg] = useState("");

  // Find or create entry for selected day
  const entry = cycleLog.find(e => e.date === selectedDay) || { date: selectedDay };

  const updateEntry = async (field, value) => {
    if (!user) return;
    setSaving(true);
    const existing = cycleLog.find(e => e.date === selectedDay);
    const newEntry = { ...(existing || {}), date: selectedDay, user_id: user.id, [field]: value };
    try {
      if (existing) {
        await sbClient.from("cycle_log").update({ [field]: value }).eq("user_id", user.id).eq("date", selectedDay);
      } else {
        await sbClient.from("cycle_log").insert([newEntry]);
      }
      setCycleLog(prev => {
        const idx = prev.findIndex(e => e.date === selectedDay);
        if (idx >= 0) { const n = [...prev]; n[idx] = newEntry; return n; }
        return [...prev, newEntry].sort((a,b) => a.date.localeCompare(b.date));
      });
      setSaveCycleMsg("Saved");
      setTimeout(() => setSaveCycleMsg(""), 1500);
    } catch(e) { setSaveCycleMsg("Error"); }
    setSaving(false);
  };

  // ── Cycle wheel ─────────────────────────────────────────────────────────────
  // Build calendar for current month: 35 days, highlight flow days
  const calMonth = selectedDay.slice(0, 7);
  const [viewMonth, setViewMonth] = useState(today.slice(0, 7));
  const [y, m] = viewMonth.split("-").map(Number);
  const firstDay = new Date(y, m - 1, 1).getDay();
  const daysInMonth = new Date(y, m, 0).getDate();
  const calDays = [];
  for (let i = 0; i < firstDay; i++) calDays.push(null);
  for (let d = 1; d <= daysInMonth; d++) calDays.push(`${viewMonth}-${String(d).padStart(2,"0")}`);

  const FLOW_COLORS = {
    none: "transparent",
    spotting: C.teal + "40",
    light: C.teal + "70",
    medium: C.teal + "aa",
    heavy: C.teal,
  };
  const FLOW_DOT = { none:"#333", spotting:"#12BFBF50", light:"#12BFBF80", medium:"#12BFBFcc", heavy:C.teal };

  const MOOD_OPTIONS = [
    { id:"great",   label:"Great",   emoji:"😊" },
    { id:"good",    label:"Good",    emoji:"🙂" },
    { id:"neutral", label:"Neutral", emoji:"😐" },
    { id:"low",     label:"Low",     emoji:"😔" },
    { id:"anxious", label:"Anxious", emoji:"😰" },
    { id:"irritable",label:"Irritable",emoji:"😤"},
  ];
  const SYMPTOMS = [
    "Cramps","Bloating","Headache","Back pain","Breast tenderness",
    "Fatigue","Nausea","Acne","Mood swings","Insomnia",
  ];
  const ENERGY_LEVELS = [
    { id:"very_low",  label:"Very low",  icon:"🪫" },
    { id:"low",       label:"Low",       icon:"🔋" },
    { id:"medium",    label:"Medium",    icon:"⚡" },
    { id:"high",      label:"High",      icon:"🔥" },
    { id:"very_high", label:"Very high", icon:"💥" },
  ];
  const SLEEP_QUALITY = [
    { id:"poor",      label:"Poor",      stars:1 },
    { id:"fair",      label:"Fair",      stars:2 },
    { id:"good",      label:"Good",      stars:3 },
    { id:"very_good", label:"Very good", stars:4 },
    { id:"excellent", label:"Excellent", stars:5 },
  ];

  const symptoms = entry.symptoms ? (Array.isArray(entry.symptoms) ? entry.symptoms : JSON.parse(entry.symptoms)) : [];
  const toggleSymptom = async (s) => {
    const next = symptoms.includes(s) ? symptoms.filter(x=>x!==s) : [...symptoms, s];
    await updateEntry("symptoms", JSON.stringify(next));
  };

  const monthLabel = new Date(y, m - 1, 1).toLocaleString("en-US", { month:"long", year:"numeric" });

  // Build a simple cycle wheel SVG (28-day wheel with current day marker)
  const CYCLE_LENGTH = 28;
  const todayEntry = cycleLog.find(e => e.date === today);
  // Find last period start (most recent heavy/medium flow day after a gap)
  const sortedFlow = cycleLog.filter(e => e.flow_intensity && e.flow_intensity !== "none").sort((a,b) => b.date.localeCompare(a.date));
  const lastPeriodDate = sortedFlow[0]?.date;
  const dayOfCycle = lastPeriodDate
    ? Math.min(CYCLE_LENGTH, Math.round((new Date(today) - new Date(lastPeriodDate)) / 86400000) + 1)
    : null;

  const CycleWheel = () => {
    const size = 220;
    const cx = size / 2, cy = size / 2, r = 80, rInner = 50;
    const segments = [];
    for (let i = 0; i < CYCLE_LENGTH; i++) {
      const startAngle = (i / CYCLE_LENGTH) * 2 * Math.PI - Math.PI / 2;
      const endAngle   = ((i + 1) / CYCLE_LENGTH) * 2 * Math.PI - Math.PI / 2;
      const x1 = cx + r * Math.cos(startAngle), y1 = cy + r * Math.sin(startAngle);
      const x2 = cx + r * Math.cos(endAngle),   y2 = cy + r * Math.sin(endAngle);
      const x3 = cx + rInner * Math.cos(endAngle), y3 = cy + rInner * Math.sin(endAngle);
      const x4 = cx + rInner * Math.cos(startAngle), y4 = cy + rInner * Math.sin(startAngle);
      const isCurrent = dayOfCycle === i + 1;
      // Phase colors
      let fill = "#1a1a1a";
      if (i < 5) fill = "#FF453A22"; // menstrual
      else if (i < 14) fill = "#12BFBF18"; // follicular
      else if (i >= 14 && i < 16) fill = "#F5830022"; // ovulation
      else fill = "#88448822"; // luteal
      if (isCurrent) fill = C.teal + "60";
      segments.push(
        <path key={i}
          d={`M ${x1} ${y1} A ${r} ${r} 0 0 1 ${x2} ${y2} L ${x3} ${y3} A ${rInner} ${rInner} 0 0 0 ${x4} ${y4} Z`}
          fill={fill} stroke="#0c0c0c" strokeWidth="1.5" />
      );
    }
    const phase = dayOfCycle === null ? "—"
      : dayOfCycle <= 5 ? "Menstrual"
      : dayOfCycle <= 13 ? "Follicular"
      : dayOfCycle <= 16 ? "Ovulation"
      : "Luteal";
    const phaseColor = dayOfCycle === null ? "#555"
      : dayOfCycle <= 5 ? C.red
      : dayOfCycle <= 13 ? C.teal
      : dayOfCycle <= 16 ? C.orange
      : "#aa44aa";
    return (
      <div style={{ display:"flex", flexDirection:"column", alignItems:"center", marginBottom:8 }}>
        <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
          {segments}
          {/* Center text */}
          <text x={cx} y={cy - 10} textAnchor="middle" fill="#fff" fontSize="26" fontWeight="300">
            {dayOfCycle ?? "?"}
          </text>
          <text x={cx} y={cy + 10} textAnchor="middle" fill="#666" fontSize="10">
            {dayOfCycle ? "day of cycle" : "no data yet"}
          </text>
          <text x={cx} y={cy + 26} textAnchor="middle" fill={phaseColor} fontSize="11" fontWeight="500">
            {phase}
          </text>
        </svg>
        <div style={{ display:"flex", gap:12, fontSize:10, color:"#555" }}>
          {[["#FF453A","Menstrual"],["#12BFBF","Follicular"],["#F58300","Ovulation"],["#aa44aa","Luteal"]].map(([c,l]) => (
            <span key={l} style={{ display:"flex", alignItems:"center", gap:3 }}>
              <span style={{ width:6, height:6, borderRadius:"50%", background:c, display:"inline-block" }} />{l}
            </span>
          ))}
        </div>
      </div>
    );
  };

  const SectionHeader = ({ title }) => (
    <div style={{ fontSize:11, color:"#555", textTransform:"uppercase", letterSpacing:"0.07em", marginBottom:8, marginTop:18 }}>{title}</div>
  );
  const Chip = ({ label, active, onClick, color }) => (
    <button onClick={onClick} style={{
      padding:"6px 12px", borderRadius:20, fontSize:12, cursor:"pointer",
      border:`1px solid ${active ? (color||C.teal) : C.border}`,
      background: active ? (color||C.teal)+"22" : "transparent",
      color: active ? (color||C.teal) : "#666",
    }}>{label}</button>
  );

  return (
    <div style={{ paddingBottom:100 }}>
      <CycleWheel />

      {/* Month calendar strip */}
      <div style={{ background:C.card, borderRadius:16, border:`1px solid ${C.border}`, padding:14, marginBottom:4 }}>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:10 }}>
          <button onClick={()=>{ const d=new Date(y,m-2,1); setViewMonth(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`); }}
            style={{ background:"none", border:"none", color:"#666", cursor:"pointer", fontSize:18, padding:"0 4px" }}>‹</button>
          <span style={{ fontSize:13, color:"#888" }}>{monthLabel}</span>
          <button onClick={()=>{ const d=new Date(y,m,1); setViewMonth(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`); }}
            style={{ background:"none", border:"none", color:"#666", cursor:"pointer", fontSize:18, padding:"0 4px" }}>›</button>
        </div>
        <div style={{ display:"grid", gridTemplateColumns:"repeat(7,1fr)", gap:3, textAlign:"center" }}>
          {["S","M","T","W","T","F","S"].map((d,i) => (
            <div key={i} style={{ fontSize:10, color:"#444", paddingBottom:4 }}>{d}</div>
          ))}
          {calDays.map((d, i) => {
            if (!d) return <div key={i} />;
            const dayEntry = cycleLog.find(e => e.date === d);
            const flowInt = dayEntry?.flow_intensity;
            const dotColor = FLOW_DOT[flowInt] || "transparent";
            const isSelected = d === selectedDay;
            const isToday = d === today;
            return (
              <button key={d} onClick={()=>setSelectedDay(d)} style={{
                aspectRatio:"1", borderRadius:"50%", display:"flex", flexDirection:"column",
                alignItems:"center", justifyContent:"center", border:"none", cursor:"pointer",
                background: isSelected ? C.teal : isToday ? C.teal+"18" : "transparent",
                position:"relative",
              }}>
                <span style={{ fontSize:12, color: isSelected ? "#000" : isToday ? C.teal : "#888" }}>
                  {parseInt(d.split("-")[2])}
                </span>
                {flowInt && flowInt !== "none" && !isSelected && (
                  <div style={{ position:"absolute", bottom:2, width:4, height:4, borderRadius:"50%", background:dotColor }} />
                )}
              </button>
            );
          })}
        </div>
      </div>

      {/* Day log for selected date */}
      <div style={{ fontSize:13, color:C.teal, marginBottom:12, marginTop:12 }}>
        {selectedDay === today ? "Today" : new Date(selectedDay + "T12:00:00").toLocaleDateString("en-US", { weekday:"long", month:"short", day:"numeric" })}
        {saving && <span style={{ color:"#555", fontSize:11, marginLeft:8 }}>Saving…</span>}
        {saveMsg && <span style={{ color:C.teal, fontSize:11, marginLeft:8 }}>{saveMsg}</span>}
      </div>

      {/* Flow */}
      <SectionHeader title="Flow" />
      <div style={{ background:C.card, borderRadius:16, border:`1px solid ${C.border}`, padding:14, marginBottom:4 }}>
        <div style={{ fontSize:12, color:"#888", marginBottom:8 }}>Intensity</div>
        <div style={{ display:"flex", gap:6, flexWrap:"wrap" }}>
          {[["none","None"],["spotting","Spotting"],["light","Light"],["medium","Medium"],["heavy","Heavy"]].map(([v,l]) => (
            <Chip key={v} label={l} active={entry.flow_intensity===v} onClick={()=>updateEntry("flow_intensity",v)} />
          ))}
        </div>
        {entry.flow_intensity && entry.flow_intensity !== "none" && (
          <>
            <div style={{ fontSize:12, color:"#888", marginBottom:8, marginTop:12 }}>Color</div>
            <div style={{ display:"flex", gap:6, flexWrap:"wrap" }}>
              {[["bright_red","Bright red","#FF453A"],["dark_red","Dark red","#8B0000"],["brown","Brown","#8B4513"],["pink","Pink","#FFB6C1"],["black","Black","#333"]].map(([v,l,c]) => (
                <Chip key={v} label={l} active={entry.flow_color===v} onClick={()=>updateEntry("flow_color",v)} color={c} />
              ))}
            </div>
          </>
        )}
      </div>

      {/* Symptoms */}
      <SectionHeader title="Physical symptoms" />
      <div style={{ background:C.card, borderRadius:16, border:`1px solid ${C.border}`, padding:14, marginBottom:4 }}>
        <div style={{ display:"flex", gap:6, flexWrap:"wrap" }}>
          {SYMPTOMS.map(s => (
            <Chip key={s} label={s} active={symptoms.includes(s)} onClick={()=>toggleSymptom(s)} color={C.orange} />
          ))}
        </div>
      </div>

      {/* Mood */}
      <SectionHeader title="Mood" />
      <div style={{ background:C.card, borderRadius:16, border:`1px solid ${C.border}`, padding:14, marginBottom:4 }}>
        <div style={{ display:"flex", gap:8, flexWrap:"wrap" }}>
          {MOOD_OPTIONS.map(m => (
            <button key={m.id} onClick={()=>updateEntry("mood",m.id)} style={{
              padding:"8px 12px", borderRadius:12, cursor:"pointer",
              border:`1px solid ${entry.mood===m.id?C.teal:C.border}`,
              background:entry.mood===m.id?C.teal+"18":"transparent",
              color:entry.mood===m.id?C.teal:"#666", fontSize:13,
            }}>{m.emoji} {m.label}</button>
          ))}
        </div>
      </div>

      {/* Energy */}
      <SectionHeader title="Energy" />
      <div style={{ background:C.card, borderRadius:16, border:`1px solid ${C.border}`, padding:14, marginBottom:4 }}>
        <div style={{ display:"flex", gap:6 }}>
          {ENERGY_LEVELS.map(e => (
            <button key={e.id} onClick={()=>updateEntry("energy",e.id)} style={{
              flex:1, padding:"10px 4px", borderRadius:10, cursor:"pointer", textAlign:"center",
              border:`1px solid ${entry.energy===e.id?C.teal:C.border}`,
              background:entry.energy===e.id?C.teal+"18":"transparent",
            }}>
              <div style={{ fontSize:16 }}>{e.icon}</div>
              <div style={{ fontSize:9, color:entry.energy===e.id?C.teal:"#555", marginTop:2 }}>{e.label}</div>
            </button>
          ))}
        </div>
      </div>

      {/* Sleep quality */}
      <SectionHeader title="Sleep quality" />
      <div style={{ background:C.card, borderRadius:16, border:`1px solid ${C.border}`, padding:14, marginBottom:4 }}>
        <div style={{ display:"grid", gridTemplateColumns:"repeat(5,1fr)", gap:4 }}>
          {SLEEP_QUALITY.map(s => (
            <button key={s.id} onClick={()=>updateEntry("sleep_quality",s.id)} style={{
              padding:"8px 2px", borderRadius:10, cursor:"pointer", textAlign:"center",
              border:`1px solid ${entry.sleep_quality===s.id?C.teal:C.border}`,
              background:entry.sleep_quality===s.id?C.teal+"18":"transparent",
              minWidth:0,
            }}>
              <div style={{ fontSize:11, color:entry.sleep_quality===s.id?C.teal:"#555", letterSpacing:"-1px" }}>
                {"★".repeat(s.stars)}
              </div>
              <div style={{ fontSize:9, color:entry.sleep_quality===s.id?C.teal:"#555", marginTop:2, whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis" }}>{s.label}</div>
            </button>
          ))}
        </div>
      </div>

      {/* Sexual activity */}
      <SectionHeader title="Sexual activity" />
      <div style={{ background:C.card, borderRadius:16, border:`1px solid ${C.border}`, padding:14, marginBottom:4 }}>
        <div style={{ display:"flex", gap:6, flexWrap:"wrap" }}>
          {[["none","None"],["protected","Protected"],["unprotected","Unprotected"],["high_desire","High desire"],["low_desire","Low desire"]].map(([v,l]) => (
            <Chip key={v} label={l} active={entry.sexual_activity===v} onClick={()=>updateEntry("sexual_activity",v)} />
          ))}
        </div>
      </div>

      {/* Supplements */}
      <SectionHeader title="Supplements / medications" />
      <div style={{ background:C.card, borderRadius:16, border:`1px solid ${C.border}`, padding:14, marginBottom:4 }}>
        <textarea
          key={`supp-${selectedDay}`}
          defaultValue={entry.supplements || ""}
          onBlur={e => { if (e.target.value !== (entry.supplements||"")) updateEntry("supplements", e.target.value); }}
          placeholder="e.g. Iron, Magnesium, Ibuprofen…"
          rows={2}
          style={{ width:"100%", background:"#0a0a0a", border:`1px solid ${C.border}`, borderRadius:8, padding:"8px 10px", color:"#ccc", fontSize:13, resize:"vertical", fontFamily:"inherit" }}
        />
      </div>

      {/* Notes */}
      <SectionHeader title="Notes" />
      <div style={{ background:C.card, borderRadius:16, border:`1px solid ${C.border}`, padding:14, marginBottom:16 }}>
        <textarea
          key={`notes-${selectedDay}`}
          defaultValue={entry.notes || ""}
          onBlur={e => { if (e.target.value !== (entry.notes||"")) updateEntry("notes", e.target.value); }}
          placeholder="How are you feeling? Anything else to note…"

// Daily rotation: pick N items per subtopic based on day of year
function getDailyItems(items, count = 3) {
  const dayOfYear = Math.floor((Date.now() - new Date(new Date().getFullYear(), 0, 0)) / 86400000);
  const offset = dayOfYear % items.length;
  const result = [];
  for (let i = 0; i < count && i < items.length; i++) {
    result.push(items[(offset + i) % items.length]);
  }
  return result;
}
